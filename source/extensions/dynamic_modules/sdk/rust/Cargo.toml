[package]
name = "envoy-proxy-dynamic-modules-rust-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Envoy Proxy Authors <envoy-dev@googlegroups.com>"]
description = "Envoy Proxy Dynamic Modules Rust SDK"
license = "Apache-2.0"
repository = "https://github.com/envoyproxy/envoy"

[features]
default = []
mock = ["dep:mockall"]

[dependencies]
mockall = { version = "0.15.0", optional = true }
smallvec = "1"
strum = "0.26"
strum_macros = "0.26"

[dev-dependencies]
mockall = "0.15.0"

[lib]
