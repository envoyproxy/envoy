static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: ai_gateway
              domains:
              - "*"
              routes:
              - match:
                  path: "/v1/chat/completions"
                route:
                  cluster: openai
                  retry_policy:
                    retry_on: 5xx,connect-failure,reset,retriable-status-codes
                    retriable_status_codes:
                    - 429
                    num_retries: 1
                typed_per_filter_config:
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request:
                      llm_protocol: OPENAI_CHAT_COMPLETIONS
          http_filters:
          - name: envoy.filters.http.ai_protocol_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
              request_handling: {}
              filters:
              - name: envoy.http.ai_filters.schema_validation
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.schema_validation.v3.SchemaValidation
              - name: envoy.http.ai_filters.request_info
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.request_info.v3.RequestInfo
              - name: envoy.http.ai_filters.model_router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.model_router.v3.ModelRouter
                  providers:
                  - name: openai
                    llm_protocol: OPENAI_CHAT_COMPLETIONS
                    host_and_port: api.openai.com
                  models:
                  - name: primary
                    provider: openai
                    model: gpt-4o
                    api_key:
                      inline_string: "Bearer sk-example"
                  - name: fallback
                    provider: openai
                    model: gpt-4o-mini
                    api_key:
                      inline_string: "Bearer sk-example"
                  routes:
                  - requested_model: fast
                    targets:
                    - model: primary
                    - model: fallback
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              upstream_http_filters:
              - name: envoy.filters.http.ai_protocol_manager
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
                  request_handling: {}
                  filters:
                  - name: envoy.http.ai_filters.route_selector
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.ai_filters.route_selector.v3.RouteSelector
                  - name: envoy.http.ai_filters.transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                      request_handling: TO_IR
                      response_handling: FROM_IR
                  - name: envoy.http.ai_filters.transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                      request_handling: FROM_IR
                      response_handling: TO_IR
              - name: envoy.filters.http.upstream_codec
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec

  clusters:
  - name: openai
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: openai
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: api.openai.com
                port_value: 443
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.openai.com
