syntax = "proto3";

package envoy.extensions.filters.network.istio_hbone.v3alpha;

import "envoy/config/core/v3/base.proto";
import "envoy/extensions/filters/network/tcp_proxy/v3/tcp_proxy.proto";
import "envoy/extensions/transport_sockets/internal_upstream/v3/internal_upstream.proto";

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.network.istio_hbone.v3alpha";
option java_outer_classname = "IstioHboneProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/contrib/envoy/extensions/filters/network/istio_hbone/v3alpha";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: Istio HBONE CONNECT wait]

// Validating configuration factory for the standard TCP proxy filter on an HBONE
// origination internal listener. Use together with UpstreamConfig on the cluster
// connecting to this listener and ConnectionPoolConfig on both the application
// and HBONE clusters. A standard TCP proxy configuration may also be used directly.
// The upstream cluster must use HTTP/2 and configure the required HBONE mutual TLS context.
// [#extension: envoy.filters.network.istio_hbone]
message Config {
  // TCP proxy settings. HTTP CONNECT tunneling and immediate upstream connection
  // establishment are required. Application TLS and PROXY protocol wrapping of
  // the internal connection are not supported by this adapter.
  tcp_proxy.v3.TcpProxy tcp_proxy = 1 [(validate.rules).message = {required: true}];
}

// Transport socket for clusters whose endpoints are HBONE origination internal
// listeners using TCP proxy. Holds connection readiness and all application bytes
// until the tunneling pool receives a successful CONNECT response. Use together with
// ConnectionPoolConfig on both application and HBONE clusters.
// [#extension: envoy.transport_sockets.istio_hbone]
message UpstreamConfig {
  // Metadata to pass to the internal listener, including original destination
  // metadata when required by the listener's original destination filter.
  repeated transport_sockets.internal_upstream.v3.InternalUpstreamTransport.MetadataValueSource
      passthrough_metadata = 1;

  // Optional wrapped transport, started only after CONNECT acceptance. Defaults
  // to raw buffer. Use TLS here on the inner HTTP/2 cluster of double HBONE, with
  // the pool adapter on the outer HBONE cluster.
  config.core.v3.TransportSocket transport_socket = 2;
}

// Required cluster upstream_config for both application and HBONE clusters using
// CONNECT wait. On HBONE clusters, signals connection readiness after CONNECT
// acceptance. Handles permanent CONNECT rejections before retry and outlier accounting.
// HTTP callers receive 403 for CONNECT 401, the original status for other 4xx,
// and 502 for other non-5xx statuses. The original CONNECT status is retained in
// failure diagnostics with the ``UF`` response flag. TCP callers are closed.
// Successful connections and transient failures retain the standard pool behavior.
// Must be deployed together with the adapter sockets.
// [#extension: envoy.upstreams.istio_hbone]
message ConnectionPoolConfig {
}
