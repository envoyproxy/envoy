syntax = "proto3";

package envoy.extensions.filters.network.reverse_tunnel.v3;

import "envoy/extensions/filters/network/http_connection_manager/v3/http_connection_manager.proto";

import "google/protobuf/duration.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.network.reverse_tunnel.v3";
option java_outer_classname = "DrainAwareHcmProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/network/reverse_tunnel/v3;reverse_tunnelv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Drain-Aware HTTP Connection Manager]
// A network filter that wraps the standard HCM and drains all active HTTP/2
// connections when the listener is drained (e.g. via admin /drain_listeners).
// Intended for use on reverse-tunnel listeners so that agents can detect drain
// and re-establish connections gracefully.
// [#extension: envoy.filters.network.reverse_tunnel_drain_aware_http_connection_manager]

// Configuration for the drain-aware HTTP Connection Manager.
// All HCM fields are forwarded verbatim. In addition, when the listener drains,
// every connection is drained like an HCM graceful drain, whether or not any of
// the fields below are set: a soft GOAWAY (shutdown notice) is sent when the
// drain starts, and the final GOAWAY follows after ``hcm_config.drain_timeout``,
// extended by ``hcm_config.drain_timeout_jitter`` if set. With
// ``enable_drain_with_goaway``, a reverse tunnel instead sends the soft GOAWAY and an optional
// METADATA frame at the configured delays before the final GOAWAY. Without
// ``shutdown_notice_delay``, such a tunnel receives no GOAWAY until the final one. On
// any local drain of an established HTTP/2 tunnel (including connection rotation, filter-chain
// updates and admin listener drains), such a tunnel requests a replacement unless the listener has
// stopped tunnel initiation. This applies with either value of the runtime guard below.
// The runtime guard ``envoy.reloadable_features.reverse_tunnel_listener_drain`` defaults to false.
// When enabled, whole-listener draining stops pending handshakes and replacement dials regardless of
// ``enable_drain_with_goaway``. With that option also enabled, idle tunnels request replacements
// during in-place filter-chain updates while retaining HCM's existing drain grace. Admin listener
// drains close unused tunnels without replacements. Full listener replacement and hot restart
// retain the existing grace for unused tunnels so the successor can establish its tunnels.
message DrainAwareHttpConnectionManager {
  // The underlying HCM configuration to apply.
  http_connection_manager.v3.HttpConnectionManager hcm_config = 1;

  // When true, a peer-initiated GOAWAY, connection-level METADATA frame carrying
  // ``envoy.reverse_tunnel.drain: true``, or any local drain of an established HTTP/2 tunnel retires
  // the reverse tunnel and requests a replacement while in-flight streams finish, unless the
  // listener has stopped tunnel initiation. Receiving the METADATA frame requires
  // ``hcm_config.http2_protocol_options.allow_metadata`` to be true. Local drains include connection
  // rotation, filter-chain updates and admin listener drains, with either value of the runtime guard
  // below. Default false. Required by ``metadata_delay`` and ``shutdown_notice_delay``.
  // With ``envoy.reloadable_features.reverse_tunnel_listener_drain`` enabled, unused tunnels also
  // request replacements during in-place filter-chain updates without shortening their drain grace.
  // The runtime guard separately stops tunnel initiation on whole-listener drains, even when this
  // option is false.
  bool enable_drain_with_goaway = 2;

  // Delay from the start of a reverse tunnel drain until a METADATA frame carrying
  // ``envoy.reverse_tunnel.drain: true`` is sent. Requires ``enable_drain_with_goaway`` and
  // ``hcm_config.http2_protocol_options.allow_metadata``. Must be less than
  // ``hcm_config.drain_timeout`` and, if set, ``shutdown_notice_delay``; otherwise the config is
  // rejected. Default: 0s (not sent).
  google.protobuf.Duration metadata_delay = 3 [(validate.rules).duration = {gte {}}];

  // Delay from the start of a reverse tunnel drain until the soft GOAWAY (shutdown notice) is
  // sent, telling the peer to stop opening new streams on this tunnel. Requires
  // ``enable_drain_with_goaway``. Must be less than ``hcm_config.drain_timeout``; otherwise the
  // config is rejected. Default: 0s (not sent).
  google.protobuf.Duration shutdown_notice_delay = 4 [(validate.rules).duration = {gte {}}];
}
