syntax = "proto3";

package envoy.extensions.filters.http.on_demand.v3;

import "envoy/config/core/v3/config_source.proto";

import "google/protobuf/duration.proto";

import "udpa/annotations/status.proto";
import "udpa/annotations/versioning.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.on_demand.v3";
option java_outer_classname = "OnDemandProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/http/on_demand/v3;on_demandv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: On Demand Discovery]
// On Demand Discovery :ref:`configuration overview <config_http_filters_on_demand>`.
// [#extension: envoy.filters.http.on_demand]
//
// .. warning::
//
//    Envoy currently only supports On-demand CDS when using Incremental-xDS and not State-of-the-World.
//

// Configuration of on-demand CDS.
message OnDemandCds {
  // Configuration of on-demand discovery of request mirror (shadow) clusters. Only mirror policies
  // that name a static :ref:`cluster
  // <envoy_v3_api_field_config.route.v3.RouteAction.RequestMirrorPolicy.cluster>` trigger
  // discovery. Policies that select the cluster with a :ref:`cluster_header
  // <envoy_v3_api_field_config.route.v3.RouteAction.RequestMirrorPolicy.cluster_header>` do not,
  // because that name is controlled by the client.
  message ShadowClusterDiscovery {
  }

  // A configuration source for the service that will be used for
  // on-demand cluster discovery.
  config.core.v3.ConfigSource source = 1;

  // xdstp:// resource locator for on-demand cluster collection.
  string resources_locator = 2;

  // The timeout for on demand cluster lookup. If not set, defaults to 5 seconds.
  google.protobuf.Duration timeout = 3;

  // If set, the filter also discovers the clusters that the request's active
  // :ref:`mirror policies <envoy_v3_api_field_config.route.v3.RouteAction.request_mirror_policies>`
  // (route level or :ref:`cluster level
  // <envoy_v3_api_field_extensions.upstreams.http.v3.HttpProtocolOptions.request_mirror_policies>`)
  // send mirrored requests to.
  //
  // Unlike discovery of the request's own cluster, this discovery is best-effort and never pauses
  // or delays the request. A mirrored request whose cluster is not yet available is dropped by the
  // router, as it is without this field. Once the cluster has been discovered, later requests are
  // mirrored normally. The first requests to a cluster that has not been discovered yet are
  // therefore not mirrored.
  //
  // A mirror policy only triggers discovery for the requests the router would mirror, i.e. after
  // its ``runtime_fraction`` has been applied.
  ShadowClusterDiscovery shadow_cluster_discovery = 4;
}

// On Demand Discovery filter config.
message OnDemand {
  option (udpa.annotations.versioning).previous_message_type =
      "envoy.config.filter.http.on_demand.v2.OnDemand";

  // An optional configuration for on-demand cluster discovery
  // service. If not specified, the on-demand cluster discovery will
  // be disabled. When it's specified, the filter will pause the
  // request to an unknown cluster and will begin a cluster discovery
  // process. When the discovery is finished (successfully or not), the
  // request will be resumed for further processing.
  OnDemandCds odcds = 1;
}

// Per-route configuration for On Demand Discovery.
message PerRouteConfig {
  // An optional configuration for on-demand cluster discovery
  // service. If not specified, the on-demand cluster discovery will
  // be disabled. When it's specified, the filter will pause the
  // request to an unknown cluster and will begin a cluster discovery
  // process. When the discovery is finished (successfully or not), the
  // request will be resumed for further processing.
  OnDemandCds odcds = 1;
}
