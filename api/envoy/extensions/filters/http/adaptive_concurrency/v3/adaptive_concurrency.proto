syntax = "proto3";

package envoy.extensions.filters.http.adaptive_concurrency.v3;

import "envoy/config/core/v3/base.proto";
import "envoy/type/v3/http_status.proto";
import "envoy/type/v3/percent.proto";

import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";

import "udpa/annotations/status.proto";
import "udpa/annotations/versioning.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.adaptive_concurrency.v3";
option java_outer_classname = "AdaptiveConcurrencyProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/http/adaptive_concurrency/v3;adaptive_concurrencyv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Adaptive Concurrency]
// Adaptive Concurrency Control :ref:`configuration overview
// <config_http_filters_adaptive_concurrency>`.
// [#extension: envoy.filters.http.adaptive_concurrency]

// Configuration parameters for the gradient controller.
message GradientControllerConfig {
  option (udpa.annotations.versioning).previous_message_type =
      "envoy.config.filter.http.adaptive_concurrency.v2alpha.GradientControllerConfig";

  enum BaselineMode {
    // Preserve the existing periodic minRTT measurements or configured fixed baseline.
    LEGACY = 0;

    // Continuously estimate the baseline without low-concurrency minRTT measurements.
    EWMA = 1;
  }

  // Optional tuning parameters used only when baseline_mode is EWMA.
  message EwmaBaselineParams {
    // Half-life of the baseline in time spent in nonempty sample windows. Defaults to 300s.
    // After warmup, each window has weight 1 - 2^(-window_duration / half_life).
    google.protobuf.Duration half_life = 1 [(validate.rules).duration = {gte {nanos: 1000000}}];

    // Number of nonempty window means initially averaged arithmetically. Defaults to 10.
    // Empty windows neither advance warmup nor age the baseline.
    google.protobuf.UInt32Value warmup_windows = 2 [(validate.rules).uint32 = {gt: 0}];

    // Initial concurrency limit. Defaults to the minimum calculated concurrency limit and must
    // be between that minimum and max_concurrency_limit. Limit updates continue during warmup.
    google.protobuf.UInt32Value initial_concurrency = 3 [(validate.rules).uint32 = {gt: 0}];
  }

  // Parameters controlling the periodic recalculation of the concurrency limit from sampled request
  // latencies.
  message ConcurrencyLimitCalculationParams {
    option (udpa.annotations.versioning).previous_message_type =
        "envoy.config.filter.http.adaptive_concurrency.v2alpha.GradientControllerConfig."
        "ConcurrencyLimitCalculationParams";

    // The allowed upper-bound on the calculated concurrency limit. Defaults to 1000.
    google.protobuf.UInt32Value max_concurrency_limit = 2 [(validate.rules).uint32 = {gt: 0}];

    // The period of time samples are taken to recalculate the concurrency limit.
    google.protobuf.Duration concurrency_update_interval = 3 [(validate.rules).duration = {
      required: true
      gt {}
    }];

    // The allowed lower-bound on the calculated concurrency limit. If unset, this defaults to
    // :ref:`min_concurrency
    // <envoy_v3_api_field_extensions.filters.http.adaptive_concurrency.v3.GradientControllerConfig.MinimumRTTCalculationParams.min_concurrency>`
    // to preserve the existing behavior where the same value controls both the minimum calculated
    // limit and the limit used while measuring minRTT.
    google.protobuf.UInt32Value min_concurrency_limit = 4 [(validate.rules).uint32 = {gt: 0}];
  }

  // Parameters controlling the baseline buffer and, in LEGACY mode, minRTT recalculation.
  // [#next-free-field: 8]
  message MinimumRTTCalculationParams {
    option (udpa.annotations.versioning).previous_message_type =
        "envoy.config.filter.http.adaptive_concurrency.v2alpha.GradientControllerConfig."
        "MinimumRTTCalculationParams";

    // The time interval between recalculating the minimum request round-trip time. Has to be
    // positive. If set to zero, dynamic sampling of the minRTT is disabled.
    google.protobuf.Duration interval = 1 [(validate.rules).duration = {gte {nanos: 1000000}}];

    // The fixed value for the minRTT. This value is used when minRTT is not sampled dynamically.
    // In LEGACY mode, if dynamic sampling of the minRTT is disabled, this field must be set.
    google.protobuf.Duration fixed_value = 6 [(validate.rules).duration = {gt {}}];

    // The number of requests to aggregate/sample during the minRTT recalculation window before
    // updating. Defaults to 50.
    google.protobuf.UInt32Value request_count = 2 [(validate.rules).uint32 = {gt: 0}];

    // Randomized time delta that will be introduced to the start of the minRTT calculation window.
    // This is represented as a percentage of the interval duration. Defaults to 15%.
    //
    // Example: If the interval is 10s and the jitter is 15%, the next window will begin
    // somewhere in the range (10s - 11.5s).
    type.v3.Percent jitter = 3;

    // The concurrency limit set while measuring the minRTT in LEGACY mode. Defaults to 3.
    // Also supplies the minimum calculated limit when min_concurrency_limit is unset in either mode.
    google.protobuf.UInt32Value min_concurrency = 4 [(validate.rules).uint32 = {gt: 0}];

    // Amount added to the measured minRTT to add stability to the concurrency limit during natural
    // variability in latency. This is expressed as a percentage of the measured value and can be
    // adjusted to allow more or less tolerance to the sampled latency values.
    //
    // Defaults to 25%.
    type.v3.Percent buffer = 5;

    // Minimum absolute latency buffer. The effective buffer is the larger of this duration and
    // the percentage-based buffer, not their sum. Applies to the legacy and EWMA baselines.
    // Unset or zero preserves the existing percentage-only behavior.
    google.protobuf.Duration min_latency_delta = 7 [(validate.rules).duration = {gte {}}];
  }

  // The percentile to use when summarizing aggregated samples in LEGACY mode. Defaults to p50.
  // Must be unset in EWMA mode, which uses the arithmetic mean RTT of each sample window.
  type.v3.Percent sample_aggregate_percentile = 1;

  ConcurrencyLimitCalculationParams concurrency_limit_params = 2
      [(validate.rules).message = {required: true}];

  MinimumRTTCalculationParams min_rtt_calc_params = 3 [(validate.rules).message = {required: true}];

  // Defaults to LEGACY. EWMA is enabled only by explicitly selecting this mode.
  BaselineMode baseline_mode = 4 [(validate.rules).enum = {defined_only: true}];

  // Optional parameters for EWMA mode. All nested fields are optional. This message must be
  // unset in LEGACY mode; its presence alone does not enable EWMA. In EWMA mode, interval,
  // fixed_value, request_count, jitter, and sample_aggregate_percentile must be unset.
  EwmaBaselineParams ewma_baseline = 5;
}

message AdaptiveConcurrency {
  option (udpa.annotations.versioning).previous_message_type =
      "envoy.config.filter.http.adaptive_concurrency.v2alpha.AdaptiveConcurrency";

  oneof concurrency_controller_config {
    option (validate.required) = true;

    // Gradient concurrency control will be used.
    GradientControllerConfig gradient_controller_config = 1
        [(validate.rules).message = {required: true}];
  }

  // If set to false, the adaptive concurrency filter will operate as a pass-through filter. If the
  // message is unspecified, the filter will be enabled.
  config.core.v3.RuntimeFeatureFlag enabled = 2;

  // This field allows for a custom HTTP response status code to the downstream client when
  // the concurrency limit has been exceeded.
  // Defaults to 503 (Service Unavailable).
  //
  // .. note::
  //   If this is set to < 400, 503 will be used instead.
  type.v3.HttpStatus concurrency_limit_exceeded_status = 3;
}
