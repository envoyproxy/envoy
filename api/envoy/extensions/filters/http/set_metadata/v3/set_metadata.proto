syntax = "proto3";

package envoy.extensions.filters.http.set_metadata.v3;

import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";

import "envoy/annotations/deprecation.proto";
import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.set_metadata.v3";
option java_outer_classname = "SetMetadataProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/http/set_metadata/v3;set_metadatav3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Set-Metadata Filter]
//
// This filters adds or updates dynamic metadata with static data, or with data
// copied from a filter state object.
//
// [#extension: envoy.filters.http.set_metadata]

// [#next-free-field: 6]
message Metadata {
  // The metadata namespace.
  string metadata_namespace = 1 [(validate.rules).string = {min_len: 1}];

  // Allow the filter to overwrite or merge with an existing value in the namespace.
  bool allow_overwrite = 2;

  // The value to place at the namespace. If ``allow_overwrite``, this will
  // overwrite or merge with any existing values in that namespace. See
  // :ref:`the filter documentation <config_http_filters_set_metadata>` for
  // more information on how this value is merged with potentially existing
  // ones if ``allow_overwrite`` is configured. Only one of ``value``,
  // ``typed_value`` and ``filter_state`` may be set.
  google.protobuf.Struct value = 3;

  // The value to place at the namespace. If ``allow_overwrite``, this will
  // overwrite any existing values in that namespace. Only one of ``value``,
  // ``typed_value`` and ``filter_state`` may be set.
  google.protobuf.Any typed_value = 4;

  // A filter state object whose contents should be copied into the typed
  // dynamic metadata at the namespace.
  //
  // The object is converted to a ``google.protobuf.Any`` as follows:
  //
  // * If :ref:`value_is_serialized_any
  //   <envoy_v3_api_field_extensions.filters.http.set_metadata.v3.FilterStateSource.value_is_serialized_any>`
  //   is set, the object's string serialization (``serializeAsString()``) is
  //   parsed as a serialized ``Any``, which is used as is. If the object has no
  //   string serialization or the string is not a serialized ``Any``, nothing
  //   is written and the ``filter_state_not_serializable`` counter is
  //   incremented.
  // * Otherwise, if the object supports proto serialization
  //   (``serializeAsProto()``), the resulting message is packed into the
  //   ``Any``. If the message is already an ``Any`` it is used as is.
  // * Otherwise, if the object supports string serialization
  //   (``serializeAsString()``), the string is packed as a
  //   ``google.protobuf.StringValue``.
  // * Otherwise nothing is written and the ``filter_state_not_serializable``
  //   counter is incremented.
  //
  // If no object exists under the key, nothing is written and the
  // ``filter_state_not_found`` counter is incremented. If ``allow_overwrite``,
  // this will overwrite any existing typed value in that namespace. Only one
  // of ``value``, ``typed_value`` and ``filter_state`` may be set.
  FilterStateSource filter_state = 5;
}

// Identifies a filter state object to copy into dynamic metadata.
message FilterStateSource {
  // The key of the filter state object.
  string key = 1 [(validate.rules).string = {min_len: 1}];

  // If true, the filter state object's string serialization is a serialized
  // ``google.protobuf.Any``, which is stored as is. See :ref:`filter_state
  // <envoy_v3_api_field_extensions.filters.http.set_metadata.v3.Metadata.filter_state>`
  // for how the object is converted and what happens on failure.
  //
  // This lets a filter that can only store bytes in filter state, for example
  // a Wasm filter calling ``set_property``, provide a typed value. Without it,
  // such bytes are converted to ``Any<google.protobuf.BytesValue>``.
  bool value_is_serialized_any = 2;
}

message Config {
  // The metadata namespace.
  // This field is deprecated; please use ``metadata`` as replacement.
  string metadata_namespace = 1
      [deprecated = true, (envoy.annotations.deprecated_at_minor_version) = "3.0"];

  // The untyped value to update the dynamic metadata namespace with. See
  // :ref:`the filter documentation <config_http_filters_set_metadata>` for
  // more information on how this value is merged with potentially existing
  // ones.
  // This field is deprecated; please use ``metadata`` as replacement.
  google.protobuf.Struct value = 2
      [deprecated = true, (envoy.annotations.deprecated_at_minor_version) = "3.0"];

  // Defines changes to be made to dynamic metadata.
  repeated Metadata metadata = 3;
}
