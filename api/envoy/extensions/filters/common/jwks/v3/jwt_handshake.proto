syntax = "proto3";

package envoy.extensions.filters.common.jwks.v3;

import "envoy/config/core/v3/base.proto";
import "envoy/extensions/filters/common/jwks/v3/jwks.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.common.jwks.v3";
option java_outer_classname = "JwtHandshakeProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/common/jwks/v3;jwksv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: JWT handshake validation]
// Configuration for verifying a bearer JWT presented while a connection is being established,
// shared by extensions that authenticate a handshake before accepting the connection.

// Validation of a bearer JWT presented while establishing a connection. The token is verified
// **before** the connection is accepted, so a forged or expired token cannot produce a usable
// connection. A missing or invalid token rejects the handshake unless ``allow_missing_or_failed``
// is set.
//
// On success, the verified claims are emitted as dynamic metadata under ``claims_metadata_namespace``
// so the consuming extension can bind a claimed handshake identifier to a verified claim via
// ``%DYNAMIC_METADATA(namespace:claim)%``.
//
// .. note::
//   The JWKS may be supplied inline (``local_jwks``) or fetched over HTTP (``remote_jwks``). Either
//   way, token verification is synchronous: ``remote_jwks`` is fetched and refreshed in the
//   background (at startup and every ``cache_duration``), never on the verification path. The
//   configuration is deliberately scoped rather than reusing the full :ref:`JwtProvider
//   <envoy_v3_api_msg_extensions.filters.http.jwt_authn.v3.JwtProvider>`, whose request-param/cookie
//   extraction and upstream-forwarding fields are not meaningful for a pre-acceptance handshake; the
//   security-relevant semantics below mirror ``jwt_authn``.
//
// .. attention::
//   Verifying the token proves only that the caller *holds* a valid token; it does **not** by itself
//   prove the caller is the identity it claims. To authenticate the claimed identity, bind a verified
//   claim from the consuming extension's own validation configuration. Without such a binding, a token
//   minted for one identity can be presented for another. Tokens without an ``exp`` claim are
//   rejected. All top-level claims are published as dynamic metadata (see
//   ``claims_metadata_namespace``), so do not put secrets in the token.
// [#next-free-field: 9]
message JwtHandshakeValidator {
  // Required. Expected token issuer; the JWT ``iss`` claim must equal this value. A block with an
  // empty ``issuer`` is rejected at config load, so a validly signed token from an unexpected issuer
  // is never accepted.
  string issuer = 1 [(validate.rules).string = {max_len: 1024}];

  // Allowed audiences. If non-empty, the JWT must carry at least one of these in its ``aud`` claim;
  // matching is normalized (scheme and trailing slash) exactly as in ``jwt_authn``. If empty, the
  // audience is not checked.
  repeated string audiences = 2;

  // Source of the JSON Web Key Set (JWKS) used to verify the signature of the handshake token.
  // Exactly one source must be configured.
  oneof jwks_source_specifier {
    option (validate.required) = true;

    // The JWKS provided inline as a data source: an ``inline_string``, ``inline_bytes``, or a
    // ``filename`` loaded from disk. The keys are read once when the configuration is loaded, which
    // keeps token verification fully synchronous.
    config.core.v3.DataSource local_jwks = 3;

    // The JWKS fetched over HTTP. See :ref:`RemoteJwks
    // <envoy_v3_api_msg_extensions.filters.common.jwks.v3.RemoteJwks>` (``http_uri``,
    // ``cache_duration``, ``async_fetch``, ``retry_policy``). The keys are fetched and refreshed in
    // the background (at startup and every ``cache_duration``) and cached, so verification stays
    // synchronous. Tokens are rejected only before the first successful fetch; once fetched, keys
    // stay in effect until a later refresh replaces them, and a fetch outage does not drop them.
    // There is no on-demand refetch on an unknown ``kid``, so a key published after the last refresh
    // is not recognized for up to ``cache_duration``.
    //
    // Fetching is always in the background here, so ``RemoteJwks.async_fetch``'s documented
    // on-demand, per-worker behavior when it is unset does not apply. ``async_fetch`` only tunes
    // the background fetch: ``fast_listener`` skips the wait at startup, and
    // ``failed_refetch_duration`` sets the retry interval after a failed fetch. A ``cache_duration``
    // or ``failed_refetch_duration`` below one second is raised to one second to avoid a refetch
    // loop with no pause.
    RemoteJwks remote_jwks = 8;
  }

  // Name of the header carrying the token. Defaults to ``authorization``, and a leading ``Bearer``
  // prefix (with its trailing space) is stripped when present.
  string token_header = 4 [(validate.rules).string = {max_len: 255 ignore_empty: true}];

  // Namespace under which verified claims are emitted as dynamic metadata. If unset, the consuming
  // extension's default namespace is used. Each top-level JWT claim is written as a field in this
  // namespace so it can be referenced via ``%DYNAMIC_METADATA(namespace:claim)%`` by the consuming
  // extension's validation configuration.
  string claims_metadata_namespace = 5
      [(validate.rules).string = {max_len: 255 ignore_empty: true}];

  // If ``true``, a missing or invalid token does **not** reject the handshake (verified claims are
  // simply not published). Useful for a staged rollout / audit mode, where rejections that *would*
  // have occurred are counted without closing the connection. Defaults to ``false`` (a missing or
  // invalid token is rejected).
  //
  // Before the first successful fetch every token fails verification, so with ``remote_jwks`` a JWKS
  // server that is unreachable at startup, combined with ``allow_missing_or_failed``, admits every
  // handshake until keys are cached.
  bool allow_missing_or_failed = 6;

  // Clock skew, in seconds, allowed when checking the ``exp`` and ``nbf`` time constraints. Mirrors
  // ``jwt_authn``'s field of the same name. Defaults to 60 seconds when unset (``0``).
  uint32 clock_skew_seconds = 7;
}
