syntax = "proto3";

package envoy.extensions.stat_sinks.open_telemetry.v3;

import "envoy/config/core/v3/extension.proto";
import "envoy/config/core/v3/grpc_service.proto";
import "envoy/config/core/v3/http_service.proto";

import "google/protobuf/wrappers.proto";

import "opentelemetry/proto/common/v1/common.proto";
import "xds/type/matcher/v3/matcher.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.stat_sinks.open_telemetry.v3";
option java_outer_classname = "OpenTelemetryProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/stat_sinks/open_telemetry/v3;open_telemetryv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Open Telemetry Stats Sink]
// Stats configuration proto schema for ``envoy.stat_sinks.open_telemetry`` sink.
// [#extension: envoy.stat_sinks.open_telemetry]

// [#next-free-field: 11]
message SinkConfig {
  // ConversionAction is used to convert a stat to a metric. If a stat matches,
  // the metric_name and static_metric_labels will be
  // used to create the metric. This can be used to rename a
  // stat, add static labels, and aggregate multiple stats into a single metric.
  // [#next-free-field: 5]
  message ConversionAction {
    // The metric name to use for the stat.
    string metric_name = 2;

    // Static metric labels to use for the metric.
    repeated opentelemetry.proto.common.v1.KeyValue static_metric_labels = 3;

    // If set, the metric is reported under the OTLP resource that this defines, instead of the
    // resource built from :ref:`resource_detectors
    // <envoy_v3_api_field_extensions.stat_sinks.open_telemetry.v3.SinkConfig.resource_detectors>`.
    ResourceConversion resource_conversion = 4;
  }

  // ResourceConversion defines the OTLP resource that a converted metric is reported under. It
  // lets one sink report metrics on behalf of several entities, e.g. a node proxy that reports
  // the metrics of each workload on the node under that workload's resource. Metrics whose
  // resources have the same attributes are reported under the same ``ResourceMetrics``.
  message ResourceConversion {
    // Moves a stat tag from the data point attributes to the resource attributes.
    message TagToResourceAttribute {
      // The name of the stat tag.
      string tag_name = 1 [(validate.rules).string = {min_len: 1}];

      // The key of the resource attribute that the tag sets. If empty, ``tag_name`` is used.
      string resource_attribute_key = 2;
    }

    // If true, the resource starts with the attributes of the resource built from
    // :ref:`resource_detectors
    // <envoy_v3_api_field_extensions.stat_sinks.open_telemetry.v3.SinkConfig.resource_detectors>`.
    // Otherwise, it only has the attributes below. Default value is true.
    google.protobuf.BoolValue inherit_resource_attributes = 1;

    // Static attributes of the resource. Each overrides the inherited attribute with the same key.
    repeated opentelemetry.proto.common.v1.KeyValue static_resource_attributes = 2;

    // The stat tags to move to the resource. A listed tag is never emitted as a data point
    // attribute. If its value is not empty, it sets the resource attribute, overriding the
    // inherited or static attribute with the same key. A tag may be listed more than once to set
    // several resource attributes.
    repeated TagToResourceAttribute tags_to_resource_attributes = 3;
  }

  // DropAction is an action that, when matched, will prevent the stat from being converted to an OTLP metric and flushed.
  message DropAction {
  }

  oneof protocol_specifier {
    option (validate.required) = true;

    // The upstream gRPC cluster that implements the OTLP/gRPC collector.
    config.core.v3.GrpcService grpc_service = 1 [(validate.rules).message = {required: true}];

    // The upstream HTTP cluster that implements the OTLP/HTTP collector.
    // See `OTLP/HTTP <https://opentelemetry.io/docs/specs/otlp/#otlphttp>`_.
    //
    // .. note::
    //
    //   The ``request_headers_to_add`` property in the OTLP HTTP exporter service
    //   does not support the :ref:`format specifier <config_access_log_format>`.
    //   The values configured are added as HTTP headers on the OTLP export request
    //   without any formatting applied.
    config.core.v3.HttpService http_service = 9;
  }

  // Attributes to be associated with the resource in the OTLP message.
  // [#extension-category: envoy.tracers.opentelemetry.resource_detectors]
  repeated config.core.v3.TypedExtensionConfig resource_detectors = 7;

  // If set to true, counters will be emitted as deltas, and the OTLP message will have
  // ``AGGREGATION_TEMPORALITY_DELTA`` set as AggregationTemporality.
  bool report_counters_as_deltas = 2;

  // If set to true, histograms will be emitted as deltas, and the OTLP message will have
  // ``AGGREGATION_TEMPORALITY_DELTA`` set as AggregationTemporality.
  bool report_histograms_as_deltas = 3;

  // If set to true, metrics will have their tags emitted as OTLP attributes, which may
  // contain values used by the tag extractor or additional tags added during stats creation.
  // Otherwise, no attributes will be associated with the export message. Default value is true.
  google.protobuf.BoolValue emit_tags_as_attributes = 4;

  // If set to true, metric names will be represented as the tag extracted name instead
  // of the full metric name. Default value is true.
  google.protobuf.BoolValue use_tag_extracted_name = 5;

  // If set, emitted stats names will be prepended with a prefix, so full stat name will be
  // <prefix>.<stats_name>. For example, if the stat name is "foo.bar" and prefix is
  // "pre", the full stat name will be "pre.foo.bar". If this field is not set, there is no
  // prefix added. According to the example, the full stat name will remain "foo.bar".
  string prefix = 6;

  // The custom conversion from a stat to a metric. Currently, the only supported input is
  // ``envoy.extensions.matching.common_inputs.stats.v3.StatFullNameMatchInput``.
  // The supported actions are
  // - ``envoy.extensions.stat_sinks.open_telemetry.v3.SinkConfig.DropAction``.
  // - ``envoy.extensions.stat_sinks.open_telemetry.v3.SinkConfig.ConversionAction``.
  // If stats are not matched, they will be directly converted to OTLP metrics as usual.
  xds.type.matcher.v3.Matcher custom_metric_conversions = 8;

  // Maximum number of data points per request. If explicitly set to 0, there is no limit. If unset, it currently defaults to no limit.
  // When the maximum number of data points is reached, the remaining data points will be sent in subsequent requests.
  uint32 max_data_points_per_request = 10;
}
