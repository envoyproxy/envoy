syntax = "proto3";

package envoy.extensions.transport_sockets.tls.cert_selectors.on_demand_secret.v3;

import "envoy/config/core/v3/config_source.proto";
import "envoy/config/core/v3/extension.proto";

import "google/protobuf/wrappers.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.transport_sockets.tls.cert_selectors.on_demand_secret.v3";
option java_outer_classname = "ConfigProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/transport_sockets/tls/cert_selectors/on_demand_secret/v3;on_demand_secretv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: On-demand secret certificate selector]
// [#extension: envoy.tls.certificate_selectors.on_demand_secret]

// Fetches the secret on-demand while allowing the parent cluster or listener to accept connections
// without warming. During the handshake, a secret name is derived from the peer hello message, an
// SDS resource request starts, and the handshake is paused. Once an SDS response is received with a
// resource, the handshake is resumed with the provided certificate. If the SDS server indicates the
// resource removal, the handshake is failed, and the SDS subscription to the resource is stopped.
//
// Similar to the regular SDS, the certificate is configured using the outer common TLS context,
// e.g. by setting the FIPS compliance policy on the loaded certificate.
// [#next-free-field: 6]
message Config {
  // Defines the configuration source of the secrets.
  config.core.v3.ConfigSource config_source = 1 [(validate.rules).message = {required: true}];

  // Extension point to specify a function to compute the secret name. The extension is called
  // during the TLS handshake after receiving the *CLIENT HELLO* message from the client for the
  // downstream certificate selector, and using the transport socket options and *SERVER HELLO* for
  // the upstream certificate selector.
  // [#extension-category: envoy.tls.certificate_mappers,envoy.tls.upstream_certificate_mappers]
  config.core.v3.TypedExtensionConfig certificate_mapper = 2
      [(validate.rules).message = {required: true}];

  // A list of secret resource names to start fetching on configuration load (prior to receiving any
  // requests). The parent resource initializes immediately without waiting for the fetch to
  // complete.
  repeated string prefetch_secret_names = 3;

  // Maximum number of active (loaded) secrets cached in memory. When unset, the cache is unbounded.
  // If set, the number of unique ``prefetch_secret_names`` must not exceed this value.
  //
  // When the active cache reaches this limit and a newly fetched secret finishes loading, an
  // existing active secret is evicted using work-conserving per-tenant Fair-SIEVE with lazy
  // cross-tenant ownership transfer:
  //
  // * Connections may supply a tenant identifier via the string filter state object
  //   (``Router::StringAccessor``) named
  //   ``envoy.tls.certificate_selectors.on_demand_secret.tenant_id``. For upstream selectors, this
  //   object may be shared from the downstream connection. Connections without this filter state
  //   object share a single default tenant bucket, reducing the policy to global SIEVE.
  // * Eviction selects the tenant with the largest active secret count (max-min fair sharing),
  //   breaking ties in favor of evicting from the incoming tenant and rotating across other tied
  //   tenants to avoid hash-order starvation (and sweeping across visited singleton tenants when
  //   the maximum active count is 1).
  // * Within the selected tenant's intrusive FIFO queue, a moving SIEVE hand sweeps from tail
  //   toward head. If a shared secret was most recently hit by a different tenant whose active
  //   count is strictly smaller by at least two, ownership transfers in O(1) to that tenant's queue
  //   instead of evicting the shared secret. Otherwise, visited secrets have their visited bit
  //   cleared (lazy promotion) and the first unvisited secret is evicted (quick demotion).
  //
  // Stats note: ``on_demand_secret.cert_active`` tracks all cached entries (both loaded and
  // in-flight pending, so it can reach up to ``max_active_secrets + max_pending_secrets``; ready
  // secrets equal ``cert_active - cert_pending``). Bounded eviction also exports
  // ``cert_evicted``, ``cert_ownership_transferred``, ``cert_pending_rejected``, and
  // ``cert_pending``.
  google.protobuf.UInt32Value max_active_secrets = 4 [(validate.rules).uint32 = {gt: 0}];

  // Maximum number of in-flight (pending) secret subscriptions waiting for an initial SDS response.
  // When unset, pending subscriptions are unbounded.
  //
  // When this limit is reached, new on-demand secret fetches are rejected (failing the requesting
  // handshake and incrementing ``cert_pending_rejected``) while duplicate handshakes for an
  // already-pending secret continue to coalesce. If admission would reject while non-prefetched
  // pending entries have no remaining live waiters (all waiting handshakes disconnected) and have
  // been pending for at least 5 seconds, those abandoned subscriptions are reclaimed first (the
  // cooldown prevents fast-disconnecting clients from bypassing ``max_pending_secrets`` and
  // amplifying SDS load). For full fail-fast release of unresolvable
  // secrets, pair this setting with Delta SDS ``removed_resources`` responses. When per-tenant
  // filter state is in use, multi-tenant admission applies dynamic thresholds (Choudhury & Hahne,
  // alpha=1) so a single flooding tenant cannot consume all pending capacity and starve sparse
  // tenants.
  google.protobuf.UInt32Value max_pending_secrets = 5 [(validate.rules).uint32 = {gt: 0}];
}
