syntax = "proto3";

package envoy.extensions.transport_sockets.http_11_proxy.v3;

import "envoy/config/core/v3/address.proto";
import "envoy/config/core/v3/base.proto";
import "envoy/extensions/transport_sockets/tls/v3/secret.proto";

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.extensions.transport_sockets.http_11_proxy.v3";
option java_outer_classname = "UpstreamHttp11ConnectProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/transport_sockets/http_11_proxy/v3;http_11_proxyv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Upstream HTTP/1.1 Proxy]
// [#extension: envoy.transport_sockets.http_11_proxy]

// HTTP/1.1 proxy transport socket establishes an upstream connection to a proxy address
// instead of the target host's address. This behavior is triggered when the transport
// socket is configured and proxy information is provided.
//
// Behavior when proxying:
// =======================
// When an upstream connection is established, instead of connecting directly to the endpoint
// address, the client will connect to the specified proxy address, send an HTTP/1.1 ``CONNECT`` request
// indicating the endpoint address, and process the response. If the response has HTTP status 200,
// the connection will be passed down to the underlying transport socket.
//
// Configuring proxy information:
// ==============================
// Set ``typed_filter_metadata`` in :ref:`LbEndpoint.Metadata <envoy_v3_api_field_config.endpoint.v3.lbendpoint.metadata>` or :ref:`LocalityLbEndpoints.Metadata <envoy_v3_api_field_config.endpoint.v3.LocalityLbEndpoints.metadata>`.
// using the key ``envoy.http11_proxy_transport_socket.proxy_address`` and the
// proxy address in ``config::core::v3::Address`` format.
//
// If the ``default_proxy_address`` is set and proxy address is not found in
// ``typed_filter_metadata``, the default proxy address is used.
//
// Securing the connection to the proxy:
// =====================================
// By default the connection to the proxy is plaintext and the ``CONNECT`` request is only sent
// when the underlying transport socket is secure (plaintext requests are sent to the proxy using
// absolute-form URLs). If :ref:`proxy_transport_socket
// <envoy_v3_api_field_extensions.transport_sockets.http_11_proxy.v3.Http11ProxyUpstreamTransport.proxy_transport_socket>`
// or :ref:`proxy_authorization
// <envoy_v3_api_field_extensions.transport_sockets.http_11_proxy.v3.Http11ProxyUpstreamTransport.proxy_authorization>`
// is set, the socket operates in tunnel mode instead: the connection to the proxy is established
// with ``proxy_transport_socket`` (for example TLS), a ``CONNECT`` request carrying the optional
// ``Proxy-Authorization`` header is always sent, and once the proxy responds with HTTP status 200
// the underlying transport socket (TLS or plaintext) runs inside the tunnel.
//
message Http11ProxyUpstreamTransport {
  // The underlying transport socket being wrapped. Defaults to plaintext (raw_buffer) if unset.
  config.core.v3.TransportSocket transport_socket = 1;

  // Specifies the default proxy address to use if the proxy address is not present in the
  // ``typed_filter_metadata`` of the endpoint.
  config.core.v3.Address default_proxy_address = 2;

  // The transport socket used for the connection to the proxy itself, for example
  // ``envoy.transport_sockets.tls`` to connect to an HTTPS proxy. Its configuration (SNI,
  // certificate validation, client certificates, ALPN) applies to the proxy, not to the
  // endpoint. ALPN, if set, should only offer ``http/1.1``. Defaults to plaintext (raw_buffer) if
  // unset. It is only used for connections that are routed through a proxy.
  config.core.v3.TransportSocket proxy_transport_socket = 3;

  // A generic secret whose value is sent verbatim as the ``Proxy-Authorization`` header of the
  // ``CONNECT`` request, for example ``Basic dXNlcjpwYXNzd29yZA==``. The secret can be provided
  // statically in the bootstrap or fetched via SDS.
  tls.v3.SdsSecretConfig proxy_authorization = 4;
}
