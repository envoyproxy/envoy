syntax = "proto3";

package envoy.extensions.queue_policy.adaptive_lifo.v3;

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.queue_policy.adaptive_lifo.v3";
option java_outer_classname = "AdaptiveLifoProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/queue_policy/adaptive_lifo/v3;adaptive_lifov3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Adaptive LIFO Queue Policy]
// [#extension: envoy.queue_policy.adaptive_lifo]

// Configuration for the adaptive LIFO pending requests queue policy. Watermarks are absolute
// numbers of requests. Each connection pool applies them to its own pending request queue.
//
// Requests are dequeued in FIFO order until the queue size reaches the high watermark. Requests
// are then dequeued in LIFO order until the queue size reaches or falls below the low watermark.
message AdaptiveLifoQueuePolicyConfig {
  // Number of queued requests at which the queue switches from FIFO to LIFO ordering.
  // This must be greater than zero and greater than ``low_watermark``.
  uint32 high_watermark = 1 [(validate.rules).uint32 = {gt: 0}];

  // Number of queued requests at or below which the queue switches from LIFO back to FIFO
  // ordering. This may be zero and must be less than ``high_watermark``.
  uint32 low_watermark = 2;
}
