syntax = "proto3";

package envoy.extensions.queue_policy.codel.v3;

import "envoy/config/core/v3/extension.proto";

import "google/protobuf/duration.proto";
import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.queue_policy.codel.v3";
option java_outer_classname = "CodelProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/queue_policy/codel/v3;codelv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: CoDel Queue Policy]
// [#extension: envoy.queue_policy.codel]

// Configuration for the Controlled Delay (CoDel) pending requests queue policy. CoDel observes the
// minimum queue delay over each interval and drops delayed requests when the queue remains
// persistently overloaded. The underlying queue policy determines dequeue order.
message CodelQueuePolicyConfig {
  // Target queue delay. Defaults to 5 milliseconds.
  google.protobuf.Duration target_delay = 1 [(validate.rules).duration = {gte {nanos: 1000000}}];

  // Observation interval. Defaults to 100 milliseconds and must be greater than
  // ``target_delay``.
  google.protobuf.Duration interval = 2 [(validate.rules).duration = {gte {nanos: 1000000}}];

  // Queue policy used to determine dequeue order. If unset, FIFO is used. CoDel policies cannot be
  // nested.
  config.core.v3.TypedExtensionConfig underlying_queue_policy = 3;
}
