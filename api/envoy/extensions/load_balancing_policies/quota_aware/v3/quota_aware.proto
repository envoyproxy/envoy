syntax = "proto3";

package envoy.extensions.load_balancing_policies.quota_aware.v3;

import "envoy/config/cluster/v3/cluster.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.load_balancing_policies.quota_aware.v3";
option java_outer_classname = "QuotaAwareProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/load_balancing_policies/quota_aware/v3;quota_awarev3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Quota Aware Load Balancing Policy]
// [#extension: envoy.load_balancing_policies.quota_aware]

// Configuration for the Quota Aware load balancing policy.
//
// This policy does not implement weight or priority itself. It wraps the child
// ``fallback_policy`` and excludes hosts whose backend identity is absent from
// the request DynamicMetadata candidate list for this request only. HostSet
// membership is not mutated.
//
// Typical configuration:
//
// .. code-block:: yaml
//
//    metadata_namespace: envoy.filters.http.ratelimit
//    candidates_key: passedBackends
//    host_metadata_namespace: aigateway.envoy.io
//    host_backend_id_key: per_route_rule_backend_name
//    host_model_id_key: model_name_override
//    fallback_policy:
//      policies:
//      - typed_extension_config:
//          name: envoy.load_balancing_policies.round_robin
//          typed_config:
//            "@type": type.googleapis.com/envoy.extensions.load_balancing_policies.round_robin.v3.RoundRobin
//
// The candidate list is the RLS ``passedBackends`` ListValue. Each element is a
// struct with ``backend_name`` and ``model_name_override`` (the model may be
// empty). Host ``per_route_rule_backend_name`` values of the form
// ``{namespace}/{backend}/route/...`` are stripped to ``{namespace}/{backend}``.
// If the host also has ``model_name_override``, join is the pair
// ``(backend, model)`` so two refs on the same backend with different models
// can fail over independently. If the host has no model key, join is backend
// only.
//
// If the candidate list is missing or not a list, selection fail-opens to
// ``fallback_policy`` unless ``fail_closed_on_missing_metadata`` is set.
//
// See the :ref:`load balancing architecture
// overview<arch_overview_load_balancing_types>` for more information.
message QuotaAware {
  // DynamicMetadata filter name that holds the candidate list. Empty uses
  // ``envoy.filters.http.ratelimit``.
  string metadata_namespace = 1;

  // Key under ``metadata_namespace`` for the candidate list. Empty uses
  // ``passedBackends`` (RLS quota-mode DynamicMetadata field name).
  string candidates_key = 2;

  // Host metadata filter name. Empty uses ``aigateway.envoy.io``.
  string host_metadata_namespace = 3;

  // Host metadata key for the backend identity. Empty uses
  // ``per_route_rule_backend_name``.
  string host_backend_id_key = 4;

  // Host metadata key for the model identity on this endpoint. Empty uses
  // ``model_name_override``. Agent-router stamps this next to the long backend
  // id when ``BackendRef.ModelNameOverride`` is set.
  string host_model_id_key = 7;

  // If true, missing or non-list candidate metadata fails host selection with
  // HTTP 429. Proto3 default false is fail-open: the child policy runs with no
  // exclusion.
  bool fail_closed_on_missing_metadata = 5;

  // Child load balancing policy used for weight, priority, locality, and
  // health. Required.
  config.cluster.v3.LoadBalancingPolicy fallback_policy = 6
      [(validate.rules).message = {required: true}];
}
