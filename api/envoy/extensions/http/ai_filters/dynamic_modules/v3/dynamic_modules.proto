syntax = "proto3";

package envoy.extensions.http.ai_filters.dynamic_modules.v3;

import "envoy/extensions/dynamic_modules/v3/dynamic_modules.proto";

import "google/protobuf/any.proto";

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.http.ai_filters.dynamic_modules.v3";
option java_outer_classname = "DynamicModulesProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/http/ai_filters/dynamic_modules/v3;dynamic_modulesv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: Dynamic module AI filter]
// Dynamic module AI filter :ref:`configuration overview
// <config_http_filters_ai_protocol_manager_dynamic_modules>`.
// [#extension: envoy.http.ai_filters.dynamic_modules]

// Runs an AI filter implemented in a dynamic module loaded via ``dlopen``.
//
// The module sees the request after the AI Protocol Manager parsed it: it can read and modify the
// payload document, read the request's wire API, read and modify the request headers, read and
// write filter state, and reject the request with a local reply.
message DynamicModuleAiFilter {
  // Specifies the shared-object level configuration.
  //
  // Only sources that are available synchronously are supported, i.e. ``name``, ``module.local``,
  // and a ``module.remote`` that is already present in the on-disk cache.
  envoy.extensions.dynamic_modules.v3.DynamicModuleConfig dynamic_module_config = 1
      [(validate.rules).message = {required: true}];

  // The name for this AI filter configuration.
  //
  // This can be used to distinguish between different AI filter implementations inside a dynamic
  // module. When Envoy receives this configuration, it passes the ``filter_name`` to the dynamic
  // module's AI filter config init function together with the ``filter_config``.
  string filter_name = 2;

  // The configuration for the AI filter chosen by ``filter_name``. If not specified, an empty
  // configuration is passed to the module.
  //
  // ``google.protobuf.Struct`` and the ``value`` field of ``xds.type.v3.TypedStruct`` are
  // serialized as JSON before passing them to the module.
  // ``google.protobuf.BytesValue`` and ``google.protobuf.StringValue`` are passed directly
  // without the wrapper.
  google.protobuf.Any filter_config = 3;
}
