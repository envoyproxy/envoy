syntax = "proto3";

package envoy.extensions.access_loggers.syslog.v3;

import "envoy/config/core/v3/address.proto";
import "envoy/config/core/v3/substitution_format_string.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.access_loggers.syslog.v3";
option java_outer_classname = "SyslogProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/access_loggers/syslog/v3;syslogv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Syslog access log]

// Configuration for the ``envoy.access_loggers.syslog`` access logger.
// Sends access logs over syslog. Currently supports UDP and Unix domain sockets.
// The syslog protocol standard defaults to
// `RFC 3164 <https://www.rfc-editor.org/rfc/rfc3164.html>`_ and also supports
// `RFC 5424 <https://www.rfc-editor.org/rfc/rfc5424.html>`_.
// Access log content is configured with Envoy's access log format.
// Envoy does not retry failed sends or retransmit lost syslog messages.
//
// Example UDP cluster configuration:
//
// .. validated-code-block:: yaml
//   :type-name: envoy.extensions.access_loggers.syslog.v3.SyslogAccessLogConfig
//
//   cluster: syslog
//   facility: FACILITY_LOCAL7
//   severity: INFO
//   tag: envoy
//   stat_prefix: syslog
//   log_format:
//     text_format_source:
//       inline_string: '[%START_TIME%] "%REQ(:METHOD)% %REQ(:PATH)%" %RESPONSE_CODE%'
//
// Example Unix domain socket configuration:
//
// .. validated-code-block:: yaml
//   :type-name: envoy.extensions.access_loggers.syslog.v3.SyslogAccessLogConfig
//
//   pipe:
//     path: /var/run/syslog.sock
//   facility: FACILITY_LOCAL7
//   severity: INFO
//   tag: envoy
//   stat_prefix: syslog
//   log_format:
//     text_format_source:
//       inline_string: '[%START_TIME%] "%REQ(:METHOD)% %REQ(:PATH)%" %RESPONSE_CODE%'
// [#extension: envoy.access_loggers.syslog]
// [#next-free-field: 12]
message SyslogAccessLogConfig {
  // Syslog protocol standard.
  enum SyslogFormat {
    RFC3164 = 0;
    RFC5424 = 1;
  }

  // Syslog facility used to calculate the message priority. Defaults to ``LOCAL7``.
  enum Facility {
    FACILITY_LOCAL7 = 0;
    FACILITY_KERN = 1;
    FACILITY_USER = 2;
    FACILITY_MAIL = 3;
    FACILITY_DAEMON = 4;
    FACILITY_AUTH = 5;
    FACILITY_INTERN = 6;
    FACILITY_LPR = 7;
    FACILITY_NEWS = 8;
    FACILITY_UUCP = 9;
    FACILITY_CLOCK = 10;
    FACILITY_AUTHPRIV = 11;
    FACILITY_FTP = 12;
    FACILITY_NTP = 13;
    FACILITY_AUDIT = 14;
    FACILITY_ALERT = 15;
    FACILITY_CRON = 16;
    FACILITY_LOCAL0 = 17;
    FACILITY_LOCAL1 = 18;
    FACILITY_LOCAL2 = 19;
    FACILITY_LOCAL3 = 20;
    FACILITY_LOCAL4 = 21;
    FACILITY_LOCAL5 = 22;
    FACILITY_LOCAL6 = 23;
  }

  // Syslog severity used to calculate the message priority. Defaults to ``INFO``.
  enum Severity {
    INFO = 0;
    EMERG = 1;
    ALERT = 2;
    CRIT = 3;
    ERR = 4;
    WARNING = 5;
    NOTICE = 6;
    DEBUG = 7;
  }

  oneof destination {
    option (validate.required) = true;

    // Unix domain socket destination. This is not supported on Windows.
    config.core.v3.Pipe pipe = 1;

    // Name of the active, statically configured Envoy cluster used for UDP service discovery and
    // load balancing. Cluster host addresses must be IP addresses. The cluster discovery type can
    // be ``STRICT_DNS`` to dynamically resolve DNS addresses.
    string cluster = 9 [(validate.rules).string = {min_len: 1}];
  }

  // Facility placed in the PRI header. Defaults to ``LOCAL7``.
  Facility facility = 2 [(validate.rules).enum = {defined_only: true}];

  // Severity placed in the PRI header. Defaults to ``INFO``.
  Severity severity = 3 [(validate.rules).enum = {defined_only: true}];

  // Application tag associated with the syslog record. For RFC3164, this value is emitted as
  // ``TAG``. For RFC5424, it is emitted as ``APP-NAME``. Defaults to ``envoy``.
  string tag = 4 [(validate.rules).string = {max_len: 32}];

  // When true, the syslog header omits the local hostname. RFC5424 messages use the RFC-defined
  // NILVALUE (``-``) in the ``HOSTNAME`` field instead.
  bool omit_hostname = 5;

  // Access log :ref:`format <config_access_log_format>`. This is the syslog message payload.
  config.core.v3.SubstitutionFormatString log_format = 6
      [(validate.rules).message = {required: true}];

  // The prefix to use when emitting :ref:`statistics <config_access_log_stats>`.
  string stat_prefix = 7 [(validate.rules).string = {min_len: 1}];

  // Maximum size of the complete syslog message in bytes, including the syslog header and
  // formatted payload. Messages that exceed this size are truncated.
  //
  // Defaults to 1452 bytes. For UDP, this default avoids IP fragmentation when the path MTU is
  // 1500 bytes (IPv4 and IPv6). For a different path MTU, calculate the limit as:
  // ``maximum message size = path MTU - IP header size - 8-byte UDP header``.
  // For example, a 1500-byte path MTU allows ``1500 - 20 - 8 = 1472`` bytes with a 20-byte IPv4
  // header, or ``1500 - 40 - 8 = 1452`` bytes with a 40-byte IPv6 header. UDP does not retransmit
  // lost datagrams. A value larger than the calculated limit can cause IP fragmentation; if any
  // fragment is lost, the entire syslog message is lost. Verify the network path before configuring
  // a larger value.
  uint32 max_syslog_msg_bytes = 8
      [(validate.rules).uint32 = {lte: 65507 gte: 480 ignore_empty: true}];

  // The syslog protocol standard. Defaults to RFC3164.
  SyslogFormat syslog_format = 10 [(validate.rules).enum = {defined_only: true}];

  // Message type placed in the RFC5424 ``MSGID`` header field. The value must contain between
  // 1 and 32 printable ASCII characters, excluding spaces. Defaults to ``envoy.access``. This
  // field is ignored when ``syslog_format`` is RFC3164.
  string msg_id = 11 [(validate.rules).string = {pattern: "^[!-~]{1,32}$" ignore_empty: true}];
}
