syntax = "proto3";

package envoy.extensions.router.route_specifiers.dynamic_modules.v3;

import "envoy/config/core/v3/base.proto";
import "envoy/config/route/v3/route_components.proto";
import "envoy/extensions/dynamic_modules/v3/dynamic_modules.proto";
import "envoy/type/matcher/v3/regex.proto";

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.router.route_specifiers.dynamic_modules.v3";
option java_outer_classname = "DynamicModulesProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/router/route_specifiers/dynamic_modules/v3;dynamic_modulesv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Dynamic modules route specifier]
//
// A :ref:`route specifier <config_http_conn_man_route_specifiers>` implemented by a
// :ref:`dynamic module <arch_overview_dynamic_modules>`. For each request the module keeps the
// route that route matching resolved, refines it, replaces it with one of the route templates
// declared here, drops it, or lets route matching carry on with the next route. Envoy builds every
// route from validated configuration, so a module can never produce a malformed route.
//
// See :ref:`the dynamic modules route specifier
// <config_http_route_specifiers_dynamic_modules>` for more details.
// [#extension: envoy.router.route_specifiers.dynamic_modules]

// What Envoy does when the decision of the module cannot be honored.
//
// This covers a module that reports an error, which is what the SDK does when the module panics,
// a decision or a status Envoy does not know, a template selection that names an identifier that
// is not declared, a template whose ``match`` does not hold for the request, an override recorded
// without a template while route matching resolved no route, route entry overrides recorded for a
// direct response, and route metadata a typed metadata factory rejects.
enum FailurePolicy {
  // Must be set explicitly.
  FAILURE_POLICY_UNSPECIFIED = 0;

  // Use the route the specifier was given, unchanged, and carry on with the chain. This keeps the
  // routing of the route table the module replaces in effect while it is being rolled out. If the
  // specifier was given no route, the request has no route.
  PASS_THROUGH = 1;

  // Use no route, so the request is handled as if nothing had matched, and end the chain. Prefer
  // this once the module owns the routing of the virtual host, so that a failure never falls back
  // to the routes that are left.
  NO_ROUTE = 2;

  // Skip the route the specifier was given and let route matching carry on with the next route,
  // keeping the route table the module replaces in effect for the request. Prefer this for the
  // catch all route that owns routing during a migration, so a module failure falls back to the
  // route table rather than to the catch all route's own action.
  CONTINUE_MATCHING = 3;
}

// A named route the module may select for a request.
//
// A template is built and validated once, when the specifier is configured, so an invalid template
// is rejected at configuration load. It inherits from the virtual host and the route configuration
// the specifier is configured on, exactly like a configured route does. When the module selects a
// template, Envoy evaluates it against the request like a configured route: the
// :ref:`match <envoy_v3_api_field_config.route.v3.Route.match>` must hold, otherwise the
// ``failure_policy`` applies, and the action is resolved the usual way, including
// :ref:`weighted_clusters <envoy_v3_api_field_config.route.v3.RouteAction.weighted_clusters>` and
// :ref:`cluster specifier plugins
// <envoy_v3_api_field_config.route.v3.RouteAction.cluster_specifier_plugin>`.
message RouteTemplate {
  // The identifier the module selects this template with. Must be unique within the specifier.
  string template_id = 1 [(validate.rules).string = {min_len: 1}];

  // The route. ``route_specifiers`` must be empty, since a template is not run through the
  // specifier chains.
  config.route.v3.Route route = 2 [(validate.rules).message = {required: true}];
}

// Route properties the module may select for a request.
//
// These properties are built from other extensions, so they are declared here and built once at
// configuration load rather than constructed on the request path. An entry that replaces no
// property is rejected. A property an entry leaves unset keeps the value of the route the decision
// produced, so an entry can never remove a property that route configures.
// [#next-free-field: 12]
message RouteOverride {
  // The identifier the module selects this override with. Must be unique within the specifier.
  string override_id = 1 [(validate.rules).string = {min_len: 1}];

  // Retry policy replacing the retry policy of the produced route.
  config.route.v3.RetryPolicy retry_policy = 2;

  // Metadata match criteria replacing those of the produced route, used by subset load balancing.
  // Only the ``envoy.lb`` entry of :ref:`filter_metadata
  // <envoy_v3_api_field_config.core.v3.Metadata.filter_metadata>` is used, matching the behavior of
  // :ref:`RouteAction.metadata_match
  // <envoy_v3_api_field_config.route.v3.RouteAction.metadata_match>`. An entry whose only property
  // is a ``metadata_match`` without an ``envoy.lb`` entry replaces nothing and is rejected.
  config.core.v3.Metadata metadata_match = 3;

  // Request mirroring policies replacing those of the produced route. Statically named mirror
  // clusters are checked against the cluster manager when ``validate_clusters`` is enabled.
  repeated config.route.v3.RouteAction.RequestMirrorPolicy request_mirror_policies = 4;

  // Hash policy replacing the hash policy of the produced route, used when the upstream cluster
  // employs a hashing load balancer. A cluster level and a load balancer level hash policy, when
  // configured, take precedence over this route level policy.
  repeated config.route.v3.RouteAction.HashPolicy hash_policy = 5;

  // Hedge policy replacing the hedge policy of the produced route.
  config.route.v3.HedgePolicy hedge_policy = 6;

  // Rate limits replacing the rate limits of the produced route.
  repeated config.route.v3.RateLimit rate_limits = 7;

  // CORS policy replacing the CORS policy of the produced route. The CORS filter reads it only when
  // CORS is not configured through per filter configuration.
  config.route.v3.CorsPolicy cors = 8;

  // Regex rewrite of the request path, replacing the path the produced route sends upstream,
  // unless the module records a path of its own, which wins. The
  // pattern is compiled once when the specifier is configured. It applies to the path without the
  // query string, which is preserved, and the result is capped at
  // :ref:`max_rewritten_path_bytes
  // <envoy_v3_api_field_extensions.router.route_specifiers.dynamic_modules.v3.DynamicModuleRouteSpecifier.max_rewritten_path_bytes>`.
  type.matcher.v3.RegexMatchAndSubstitute regex_rewrite = 9;

  // Tracing configuration replacing the tracing settings of the produced route, overriding the
  // connection manager defaults for the request. This is a route level property, so it applies to
  // a direct response or a redirect route as well as a route entry.
  config.route.v3.Tracing tracing = 10;

  // Metadata layered onto the metadata of the produced route, per namespace, so consumers such as
  // the rate limit ROUTE_ENTRY action, ext_authz and the METADATA(ROUTE) formatter observe it.
  // Metadata the module records itself layers on top of it. It is a route level property. An
  // empty message layers nothing.
  config.core.v3.Metadata metadata = 11;
}

// A per worker cache of the routes the module builds from route templates.
//
// After selecting a template, a module looks the route up by a key with ``lookup_built_route``. On
// a hit Envoy uses the route a previous request on the worker built for the key and the template,
// so the module records nothing more. The route built for a key must be a function of the key. A
// template whose cluster is resolved per request, such as one with weighted clusters, a cluster
// header or a cluster specifier plugin, is not cached, and neither is a recording that depends on
// the path of the request through Envoy. For a decision the cache looks up, the regex rewrite of a
// selected route override applies when the request headers are finalized.
message BuiltRouteCache {
  // The maximum number of routes each worker keeps. When a worker is full, a route it has not used
  // recently is evicted to make room. This field is required and must be greater than zero.
  uint32 max_entries_per_worker = 1 [(validate.rules).uint32 = {gt: 0}];

  // How long a worker keeps a route it no longer uses. The route is evicted between this duration
  // and 1.25 times it after its last use, also on an idle worker. Must be at least one second. If
  // not specified, defaults to 600 seconds.
  google.protobuf.Duration max_idle_time = 2 [(validate.rules).duration = {gte {seconds: 1}}];

  // A cache hit is verified with a chance of one in this many, for which ``lookup_built_route``
  // returns ``HitVerify``. The module then records the route exactly as on a miss and Envoy uses
  // the route the recording builds. When the decision fails or its recording depends on the path of
  // the request through Envoy or differs from the one the cached route was built from, Envoy counts
  // ``built_route_cache_verify_mismatch`` and evicts the cached route. Zero disables verification.
  // If not specified, defaults to 1024.
  google.protobuf.UInt32Value verify_one_in = 3;
}

// The virtual clusters the module may select for a request with ``set_virtual_cluster``.
//
// A virtual host matches a request against its :ref:`virtual_clusters
// <envoy_v3_api_field_config.route.v3.VirtualHost.virtual_clusters>` in order, and the router
// counts the request in the :ref:`statistics <config_http_filters_router_vcluster_stats>` of the
// first one that matches. A module that knows which virtual cluster a request belongs to can select
// it instead. Like route overrides, the virtual clusters are declared here and built when the
// configuration loads rather than on the request path. A selected virtual cluster uses the
// statistics of the virtual cluster of the same name on the virtual host, with the same names and
// tags even when the virtual host does not configure that name.
message VirtualClusterOverride {
  // The :ref:`name <envoy_v3_api_field_config.route.v3.VirtualHost.name>` of the virtual host whose
  // statistics the selected virtual clusters use. The statistics of every declared name are created
  // under this virtual host when the configuration loads. A virtual cluster selected for a route of
  // another virtual host is dropped and counted in ``virtual_cluster_vhost_mismatch``, since its
  // statistics would be named after the wrong virtual host. This field is required.
  string virtual_host_name = 1 [(validate.rules).string = {min_len: 1}];

  // The names of the virtual clusters the module may select, which must be unique and not empty.
  // ``other`` declares the catch all virtual cluster, which counts the requests that match none of
  // the virtual clusters of the virtual host. At least one name is required.
  repeated string names = 2 [(validate.rules).repeated = {
    min_items: 1
    items {string {min_len: 1}}
  }];

  // Whether the router counts a request in the virtual cluster the module selected. Otherwise the
  // router counts it in the virtual cluster the virtual host matches and compares the two, or in
  // the selected one when the virtual host has no virtual clusters to compare with. A request the
  // module selects none for is left to the virtual host and never compared. If not specified,
  // defaults to ``false``.
  bool prefer_selection = 3;

  // When ``prefer_selection`` is ``true``, the virtual host also matches a request the module
  // selected a virtual cluster for, with a chance of one in this many, so that the selection is
  // still compared with it. Zero disables the comparison. If not specified, defaults to 1024.
  google.protobuf.UInt32Value verify_one_in = 4;
}

// Configuration for the dynamic modules route specifier.
// [#next-free-field: 14]
message DynamicModuleRouteSpecifier {
  // Specifies the shared object level configuration. This field is required.
  //
  // .. note::
  //   This extension loads the module while the route configuration is built, so it cannot wait
  //   for an asynchronous fetch. A remote :ref:`module
  //   <envoy_v3_api_field_extensions.dynamic_modules.v3.DynamicModuleConfig.module>` is therefore
  //   accepted only when the module is already cached on disk, and is otherwise rejected. Setting
  //   :ref:`nack_on_cache_miss
  //   <envoy_v3_api_field_extensions.dynamic_modules.v3.DynamicModuleConfig.nack_on_cache_miss>` to
  //   ``true`` makes the rejection start a background fetch so that a later update succeeds. Prefer
  //   ``name`` or a local data source.
  envoy.extensions.dynamic_modules.v3.DynamicModuleConfig dynamic_module_config = 1
      [(validate.rules).message = {required: true}];

  // The name for this route specifier configuration, used to select an implementation within the
  // module. If not specified, defaults to an empty string.
  string specifier_name = 2;

  // The configuration for the route specifier chosen by ``specifier_name``. If not specified,
  // defaults to an empty configuration.
  google.protobuf.Any specifier_config = 3;

  // Prefix for the statistics of this specifier, emitted as
  // ``<metrics_namespace>.route_specifier.<stat_prefix>.*``, where ``metrics_namespace`` is the
  // :ref:`metrics_namespace
  // <envoy_v3_api_field_extensions.dynamic_modules.v3.DynamicModuleConfig.metrics_namespace>`
  // of the module. Specifiers that share a metrics namespace and prefix share counters, so keep
  // the prefix unique within that namespace.
  string stat_prefix = 4 [(validate.rules).string = {min_len: 1}];

  // The route templates the module may select by ``template_id``, each replacing the resolved
  // route with a route built from configuration. The ``template_id`` values must be unique.
  repeated RouteTemplate route_templates = 5;

  // The route overrides the module may select by ``override_id``, each overlaying its properties
  // onto the produced route. The ``override_id`` values must be unique.
  repeated RouteOverride route_overrides = 6;

  // Fraction of requests the module is invoked for. A request outside the fraction is passed
  // through untouched and counted in ``runtime_skipped``. The stable random value of the request is
  // used, so the choice holds when the route of a request is recomputed. If not specified,
  // defaults to every request.
  //
  // .. attention::
  //   A request outside the fraction is routed by ``routes`` or ``matcher`` alone, so a fraction
  //   below 100% is only safe, as a canary or as an emergency switch with the runtime key set to
  //   ``0``, while the route table the module replaces is still complete. Once that table has been
  //   shrunk, lowering the fraction turns the affected requests into 404s or routes them wrongly, and
  //   the way back is a route configuration rollback that restores the table.
  config.core.v3.RuntimeFractionalPercent runtime_fraction = 7;

  // What Envoy does when the decision of the module cannot be honored. Must be set explicitly.
  FailurePolicy failure_policy = 8 [(validate.rules).enum = {defined_only: true}];

  // Whether the clusters the route templates and the route overrides name are checked
  // against the cluster manager while the specifier is configured. If not specified, defaults to
  // ``false``, because the clusters a route names may be delivered after the route configuration
  // that references them. An unknown cluster then fails the request with the
  // ``cluster_not_found_response_code`` of the route instead.
  google.protobuf.BoolValue validate_clusters = 9;

  // The maximum length of a request path a module rewrite may produce, covering the full ``:path``
  // value including the query string. A rewrite whose result would exceed it is rejected. If not
  // specified, defaults to 65536.
  google.protobuf.UInt32Value max_rewritten_path_bytes = 10 [(validate.rules).uint32 = {gt: 0}];

  // An opaque identifier the module reads with ``get_config_specifier_instance_id``, so that two
  // specifier instances sharing one module can tell the routes they build apart, for example by
  // writing it into the route metadata they mark their routes with. It is documentation and
  // convenience for the module and Envoy enforces nothing about it. If not specified, defaults to
  // an empty string.
  string specifier_instance_id = 11 [(validate.rules).string = {max_len: 256}];

  // A per worker cache of the routes the module builds from route templates. It requires a
  // specifier configured on a virtual host or a route. If not specified, no route is cached.
  BuiltRouteCache built_route_cache = 12;

  // The virtual clusters the module may select for a request. If not specified,
  // ``set_virtual_cluster`` rejects every name and the router counts every request in the virtual
  // cluster the virtual host matches.
  VirtualClusterOverride virtual_cluster_override = 13;
}
