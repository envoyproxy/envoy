syntax = "proto3";

package envoy.type.tracing.v3;

import "envoy/type/metadata/v3/metadata.proto";

import "udpa/annotations/status.proto";
import "udpa/annotations/versioning.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.type.tracing.v3";
option java_outer_classname = "CustomTagProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/type/tracing/v3;tracingv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Custom Tag]

// Describes custom tags for the active span.
// [#next-free-field: 8]
message CustomTag {
  option (udpa.annotations.versioning).previous_message_type = "envoy.type.tracing.v2.CustomTag";

  // Specifies how the resolved tag value should be typed on tracers that support
  // typed span attributes (e.g. OpenTelemetry). The integer and floating-point
  // cases are declared explicitly so the emitted attribute type is deterministic
  // rather than inferred from the value.
  enum ValueType {
    // Emit the tag value as a string. This is the default and preserves the
    // preexisting behavior for every tracer.
    STRING = 0;

    // Coerce the resolved tag value to a signed 64-bit integer. Tracers that
    // support typed span attributes emit it as a native integer attribute (for
    // OpenTelemetry, an OTLP ``int_value``). If the value does not parse as an
    // integer, or the tracer has no typed-attribute support, it falls back to a
    // string tag.
    INT = 1;

    // Coerce the resolved tag value to a double. Tracers that support typed span
    // attributes emit it as a native floating-point attribute (for OpenTelemetry,
    // an OTLP ``double_value``). If the value does not parse as a double, or the
    // tracer has no typed-attribute support, it falls back to a string tag.
    DOUBLE = 2;

    // Coerce the resolved tag value to a boolean. Tracers that support typed span
    // attributes emit it as a native boolean attribute (for OpenTelemetry, an OTLP
    // ``bool_value``). Accepts the usual boolean spellings (``true``/``false``,
    // ``1``/``0``, etc.). If the value does not parse as a boolean, or the tracer
    // has no typed-attribute support, it falls back to a string tag.
    BOOL = 3;
  }

  // Literal type custom tag with static value for the tag value.
  message Literal {
    option (udpa.annotations.versioning).previous_message_type =
        "envoy.type.tracing.v2.CustomTag.Literal";

    // Static literal value to populate the tag value.
    string value = 1 [(validate.rules).string = {min_len: 1}];
  }

  // Environment type custom tag with environment name and default value.
  message Environment {
    option (udpa.annotations.versioning).previous_message_type =
        "envoy.type.tracing.v2.CustomTag.Environment";

    // Environment variable name to obtain the value to populate the tag value.
    string name = 1 [(validate.rules).string = {min_len: 1}];

    // When the environment variable is not found,
    // the tag value will be populated with this default value if specified,
    // otherwise no tag will be populated.
    string default_value = 2;
  }

  // Header type custom tag with header name and default value.
  message Header {
    option (udpa.annotations.versioning).previous_message_type =
        "envoy.type.tracing.v2.CustomTag.Header";

    // Header name to obtain the value to populate the tag value.
    string name = 1
        [(validate.rules).string = {min_len: 1 well_known_regex: HTTP_HEADER_NAME strict: false}];

    // When the header does not exist,
    // the tag value will be populated with this default value if specified,
    // otherwise no tag will be populated.
    string default_value = 2;
  }

  // Metadata type custom tag using
  // :ref:`MetadataKey <envoy_v3_api_msg_type.metadata.v3.MetadataKey>` to retrieve the protobuf value
  // from :ref:`Metadata <envoy_v3_api_msg_config.core.v3.Metadata>`, and populate the tag value with
  // `the canonical JSON <https://developers.google.com/protocol-buffers/docs/proto3#json>`_
  // representation of it.
  message Metadata {
    option (udpa.annotations.versioning).previous_message_type =
        "envoy.type.tracing.v2.CustomTag.Metadata";

    // Specify what kind of metadata to obtain tag value from.
    metadata.v3.MetadataKind kind = 1;

    // Metadata key to define the path to retrieve the tag value.
    metadata.v3.MetadataKey metadata_key = 2;

    // When no valid metadata is found,
    // the tag value would be populated with this default value if specified,
    // otherwise no tag would be populated.
    string default_value = 3;
  }

  // Used to populate the tag name.
  string tag = 1 [(validate.rules).string = {min_len: 1}];

  // Used to specify what kind of custom tag.
  oneof type {
    option (validate.required) = true;

    // A literal custom tag.
    Literal literal = 2;

    // An environment custom tag.
    Environment environment = 3;

    // A request header custom tag.
    Header request_header = 4;

    // A custom tag to obtain tag value from the metadata.
    Metadata metadata = 5;

    // Custom tag value.
    //
    // The same :ref:`format specifier <config_access_log_format>` as used for
    // :ref:`HTTP access logging <config_access_log>` applies here, however
    // unknown specifier values are replaced with the empty string instead of ``-``.
    string value = 6;
  }

  // The value's type. Defaults to ``STRING``, which preserves the preexisting
  // behavior. When set to ``INT``, ``DOUBLE`` or ``BOOL``, tracers that support
  // typed span attributes (e.g. OpenTelemetry) emit the tag as an integer,
  // floating-point or boolean attribute instead of a string. Applies to every
  // custom tag type.
  ValueType value_type = 7 [(validate.rules).enum = {defined_only: true}];
}
