syntax = "proto3";

package envoy.type.v3;

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.type.v3";
option java_outer_classname = "HttpProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/type/v3;typev3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: HTTP]

enum CodecClientType {
  HTTP1 = 0;

  HTTP2 = 1;

  HTTP3 = 2;

  // Use the protocol negotiated by ALPN: HTTP/2 when ``h2`` is negotiated, otherwise HTTP/1.1,
  // including when nothing is negotiated or the connection is not TLS. This mirrors the cluster's
  // :ref:`auto_config
  // <envoy_v3_api_field_extensions.upstreams.http.v3.HttpProtocolOptions.auto_config>`.
  AUTO = 3;
}
