syntax = "proto3";

package envoy.type.ai.v3;

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.type.ai.v3";
option java_outer_classname = "LlmProtocolProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/type/ai/v3;aiv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: LLM protocol]

// Identifies the AI API contract spoken on the wire.
//
// This names request/response schemas and streaming event semantics, not the
// organization operating the backend: OpenAI, Azure OpenAI, vLLM, and any
// other OpenAI-compatible backend all speak ``OPENAI_CHAT_COMPLETIONS``.
// Provider identity, when needed, must come from configuration or routing
// metadata.
//
// Nor does it name how a provider carries the API on HTTP: Claude on the
// Anthropic API and on Vertex AI both speak ``ANTHROPIC_MESSAGES``, although
// Vertex AI names the model in the path. An :ref:`LLMBinding
// <envoy_v3_api_msg_type.ai.v3.LLMBinding>` describes such a difference, so a
// value is added here only for an API with schemas of its own.
//
// Response framing is separate: JSON, SSE, and streamed JSON-array variants
// of the same API share one ``LLMProtocol`` value.
enum LLMProtocol {
  LLM_PROTOCOL_UNSPECIFIED = 0;

  // OpenAI Chat Completions API, served as ``/v1/chat/completions``.
  OPENAI_CHAT_COMPLETIONS = 1;

  // OpenAI Responses API, served as ``/v1/responses``.
  OPENAI_RESPONSES = 2;

  // Anthropic Messages API, served as ``/v1/messages``.
  ANTHROPIC_MESSAGES = 3;

  // Gemini ``generateContent`` / ``streamGenerateContent`` APIs, served as
  // ``/v1beta/models/{model}:generateContent``.
  GEMINI_GENERATE_CONTENT = 4;
}
