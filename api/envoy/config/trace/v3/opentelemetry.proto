syntax = "proto3";

package envoy.config.trace.v3;

import "envoy/config/core/v3/extension.proto";
import "envoy/config/core/v3/grpc_service.proto";
import "envoy/config/core/v3/http_service.proto";

import "google/protobuf/wrappers.proto";

import "udpa/annotations/migrate.proto";
import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.config.trace.v3";
option java_outer_classname = "OpentelemetryProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/config/trace/v3;tracev3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: OpenTelemetry tracer]

// Configuration for the OpenTelemetry tracer.
//  [#extension: envoy.tracers.opentelemetry]
// [#next-free-field: 13]
message OpenTelemetryConfig {
  // Trace context formats that can be extracted from downstream requests and injected into
  // upstream requests.
  enum TraceContextFormat {
    // W3C Trace Context: the :ref:`traceparent <config_http_conn_man_headers_traceparent>` and
    // ``tracestate`` headers.
    // See `W3C Trace Context <https://www.w3.org/TR/trace-context/>`_.
    TRACE_CONTEXT = 0;

    // B3 single header: the :ref:`b3 <config_http_conn_man_headers_b3>` header.
    // See `B3 propagation <https://github.com/openzipkin/b3-propagation>`_.
    //
    // When extracting, both the single header and the multiple header encodings are accepted, with
    // the single header taking precedence. When injecting, only the single header is written.
    B3 = 1;

    // B3 multiple headers: the :ref:`x-b3-traceid <config_http_conn_man_headers_x-b3-traceid>`,
    // ``x-b3-spanid``, ``x-b3-sampled`` and ``x-b3-flags`` headers.
    // See `B3 propagation <https://github.com/openzipkin/b3-propagation>`_.
    //
    // When extracting, both the single header and the multiple header encodings are accepted, with
    // the single header taking precedence. When injecting, ``x-b3-traceid``, ``x-b3-spanid`` and
    // ``x-b3-sampled`` are written.
    B3_MULTI = 2;
  }

  // The upstream gRPC cluster that will receive OTLP traces.
  // Note that the tracer drops traces if the server does not read data fast enough.
  // This field can be left empty to disable reporting traces to the gRPC service.
  // Only one of ``grpc_service``, ``http_service``, ``exporter`` may be used.
  core.v3.GrpcService grpc_service = 1
      [(udpa.annotations.field_migrate).oneof_promotion = "otlp_exporter"];

  // The upstream HTTP cluster that will receive OTLP traces.
  // This field can be left empty to disable reporting traces to the HTTP service.
  // Only one of ``grpc_service``, ``http_service``, ``exporter`` may be used.
  //
  // .. note::
  //
  //   The ``request_headers_to_add`` property in the OTLP HTTP exporter service supports
  //   substitution formatters. The formatters cannot access any HTTP or connection properties, but
  //   can load content such as environment variables or files or secrets.
  core.v3.HttpService http_service = 3
      [(udpa.annotations.field_migrate).oneof_promotion = "otlp_exporter"];

  // Specifies the custom exporter to be used by the OpenTelemetry tracer.
  // Only one of ``grpc_service``, ``http_service``, ``exporter`` may be used.
  //
  // [#extension-category: envoy.tracers.opentelemetry.exporters]
  // [#not-implemented-hide:]
  core.v3.TypedExtensionConfig exporter = 10
      [(udpa.annotations.field_migrate).oneof_promotion = "otlp_exporter"];

  // The name for the service. This will be populated in the ResourceSpan Resource attributes.
  // If it is not provided, it will default to "unknown_service:envoy".
  string service_name = 2;

  // An ordered list of resource detectors
  // [#extension-category: envoy.tracers.opentelemetry.resource_detectors]
  repeated core.v3.TypedExtensionConfig resource_detectors = 4;

  // Specifies the sampler to be used by the OpenTelemetry tracer.
  // The configured sampler implements the Sampler interface defined by the OpenTelemetry specification.
  // This field can be left empty. In this case, the default Envoy sampling decision is used.
  //
  // See: `OpenTelemetry sampler specification <https://opentelemetry.io/docs/specs/otel/trace/sdk/#sampler>`_
  // [#extension-category: envoy.tracers.opentelemetry.samplers]
  core.v3.TypedExtensionConfig sampler = 5;

  // Envoy caches the span in memory when the OpenTelemetry backend service is temporarily unavailable.
  // This field specifies the maximum number of spans that can be cached. If not specified, the
  // default is 1024.
  google.protobuf.UInt32Value max_cache_size = 6;

  // Specifies whether to set the telemetry SDK resource attributes.
  // The following attributes will be set:
  //
  // - telemetry.sdk.language
  // - telemetry.sdk.name
  // - telemetry.sdk.version
  //
  // If not specified, the default is to set these attributes.
  google.protobuf.BoolValue set_telemetry_sdk_resource_attributes = 7;

  // Specifies whether to set the ``service.name`` resource attribute.
  // If not specified, the default is to set this attribute.
  google.protobuf.BoolValue set_service_name_resource_attribute = 8;

  // Specifies whether to set the instrumentation scope name ("envoy") and version on emitted traces.
  // If not specified, the default is to set the instrumentation scope name and version.
  google.protobuf.BoolValue set_instrumentation_scope = 9;

  // The trace context formats to extract from downstream requests, in order of precedence.
  // The first format whose headers are present and valid is used as the parent of the span; the
  // remaining formats are ignored. A format whose headers are malformed is skipped. If headers
  // were present but none of them could be extracted, the request is not traced.
  //
  // B3 trace context without a sampling decision joins the trace, and the span's sampling
  // decision is made by Envoy as if it were the first span in the trace.
  //
  // Each format may be listed at most once. If not specified, the default is ``[TRACE_CONTEXT]``.
  repeated TraceContextFormat incoming_trace_context = 11
      [(validate.rules).repeated = {items {enum {defined_only: true}}}];

  // The trace context formats to inject into upstream requests. Headers of formats that are not
  // listed are left unchanged.
  //
  // Each format may be listed at most once. If not specified, the default is ``[TRACE_CONTEXT]``.
  repeated TraceContextFormat outgoing_trace_context = 12
      [(validate.rules).repeated = {items {enum {defined_only: true}}}];
}
