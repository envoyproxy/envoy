syntax = "proto3";

package envoy.data.ai.v3;

import "google/protobuf/wrappers.proto";

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.data.ai.v3";
option java_outer_classname = "TokenUsageProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/data/ai/v3;aiv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: AI gateway token usage]
// Normalized LLM token usage extracted from a provider response.

// Canonical token usage published by the :ref:`AI Protocol Manager filter
// <envoy_v3_api_msg_extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager>`
// as **typed** dynamic metadata (the authoritative representation), alongside
// an equivalent untyped ``Struct`` projection under the same namespace for
// consumers that can only read untyped metadata (access-log formatters, CEL).
// Consumers that understand this message should prefer it: its integer fields
// carry full ``uint64`` precision, while the ``Struct`` projection is bounded
// by the exactly-representable double range.
//
// The counts follow the filter's canonical *inclusive* contract:
// ``input_tokens`` and ``output_tokens`` cover all billed input/output
// (cache, tool-use, and reasoning buckets are subset breakdowns) and
// ``total_tokens`` is their sum; see :ref:`BuiltinTokenUsageExtractor
// <envoy_v3_api_msg_extensions.filters.http.ai_protocol_manager.v3.BuiltinTokenUsageExtractor>`
// for the full contract. Every field is optional: dialects report different
// subsets, and a status-only record (only ``api_format``, ``model``, and
// ``extraction_status``) is published when extraction failed outright.
// [#next-free-field: 12]
message TokenUsage {
  // The wire dialect the response spoke. Deliberately a *format*, not a
  // provider identity: OpenAI-compatible backends legitimately speak a
  // dialect they are not.
  enum ApiFormat {
    // The dialect was not identified (e.g. a status-only record for a stream
    // whose usage-bearing events were never extracted).
    API_FORMAT_UNSPECIFIED = 0;

    OPENAI = 1;

    ANTHROPIC = 2;

    GEMINI = 3;
  }

  // Extraction quality. Publication itself already implies the response
  // reached a clean end of stream.
  enum ExtractionStatus {
    EXTRACTION_STATUS_UNSPECIFIED = 0;

    // Every observed usage document was extracted.
    COMPLETE = 1;

    // Extraction lost input on the stream (an oversized event, an
    // unparseable or malformed document, truncated SSE input, or a parse
    // budget exhaustion): the counts may be stale or incomplete, or absent
    // entirely for a status-only record.
    PARTIAL = 2;
  }

  ApiFormat api_format = 1;

  // The response-reported model, when present.
  string model = 2;

  // Canonical inclusive input tokens.
  google.protobuf.UInt64Value input_tokens = 3;

  // Canonical inclusive output tokens.
  google.protobuf.UInt64Value output_tokens = 4;

  // ``input_tokens + output_tokens``, computed from the canonical components;
  // falls back to the provider-reported total when a component is missing.
  google.protobuf.UInt64Value total_tokens = 5;

  // Cache-read input tokens; part of ``input_tokens``.
  google.protobuf.UInt64Value cached_input_tokens = 6;

  // Cache-write input tokens; part of ``input_tokens``.
  google.protobuf.UInt64Value cache_creation_input_tokens = 7;

  // Tool-use prompt tokens; part of ``input_tokens``.
  google.protobuf.UInt64Value tool_use_input_tokens = 8;

  // Reasoning/thought tokens; part of ``output_tokens``.
  google.protobuf.UInt64Value reasoning_tokens = 9;

  // The provider-reported total, present only when it disagrees with the
  // computed ``total_tokens``.
  google.protobuf.UInt64Value reported_total_tokens = 10;

  ExtractionStatus extraction_status = 11;
}
