[ req ]
default_bits            = 2048
distinguished_name      = req_distinguished_name

# The signing CA policy drops localityName, so it is absent here.
[ req_distinguished_name ]
countryName = US
countryName_default = US
stateOrProvinceName = California
stateOrProvinceName_default = California
organizationName = Lyft
organizationName_default = Lyft
organizationalUnitName = Lyft Engineering
organizationalUnitName_default = Lyft Engineering
commonName = revoked
commonName_default = revoked
commonName_max  = 64

# tlsfeature = status_request. BoringSSL has no `tlsfeature` extension handler,
# so the DER is spelled out here.
[ must_staple ]
1.3.6.1.5.5.7.1.24 = DER:30:03:02:01:05
