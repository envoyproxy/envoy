syntax = "proto3";

package test.extensions.filters.http.mcp_json_rest_bridge;

import "envoy/extensions/filters/http/mcp_json_rest_bridge/v3/mcp_json_rest_bridge.proto";
import "test/fuzz/common.proto";

import "validate/validate.proto";

message McpJsonRestBridgeFuzzTestCase {
  envoy.extensions.filters.http.mcp_json_rest_bridge.v3.McpJsonRestBridge config = 1
      [(validate.rules).message = {required: true}];

  // Downstream request. Each http_body.data entry is delivered in a separate decodeData() call.
  test.fuzz.HttpData request = 2 [(validate.rules).message = {required: true}];

  // Upstream response, used when the bridge forwards the request.
  test.fuzz.HttpData upstream_response = 3;
}
