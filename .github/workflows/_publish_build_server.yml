name: Publish (build server)

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      dockerhub-token:
    inputs:
      arch:
        type: string
        required: true
      request:
        type: string
        required: true
      trusted:
        type: boolean
        required: true


concurrency:
  group: >-
    ${{ github.actor != 'trigger-release-envoy[bot]'
        && github.event.inputs.head_ref
        || github.run_id
    }}-${{ inputs.arch }}-${{ github.event.workflow.id }}-publish-build-server
  cancel-in-progress: true


jobs:
  binary:
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
    permissions:
      actions: read
      contents: read
      packages: read
    name: Binary
    uses: ./.github/workflows/_run.yml
    with:
      arch: ${{ inputs.arch }}
      bazel-extra: >-
        --config=rbe
      target: release.server_only
      target-suffix: ${{ inputs.arch }}
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      cache-build-image-key-suffix: ${{ inputs.arch == 'arm64' && '-arm64' || '' }}
      concurrency-suffix: -${{ inputs.arch }}
      rbe: true
      request: ${{ inputs.request }}
      runs-on: ${{ inputs.arch == 'arm64' && (vars.ENVOY_ARM_VM || 'ubuntu-24.04-arm') || null }}
      timeout-minutes: 120
      trusted: ${{ inputs.trusted }}
      uploads: |
        release.${{ inputs.arch }}: container/envoy/${{ inputs.arch }}/bin/
        oci.${{ inputs.arch }}: container/envoy/${{ inputs.arch }}/build_images

  distribution:
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
    permissions:
      actions: read
      contents: read
      packages: read
    name: Packages
    needs:
    - binary
    uses: ./.github/workflows/_run.yml
    with:
      arch: ${{ inputs.arch }}
      bazel-extra: >-
        --config=remote-cache
      downloads: |
        release.${{ inputs.arch }}: container/release/${{ inputs.arch }}/bin/
      target: distribution
      target-suffix: ${{ inputs.arch }}
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      cache-build-image-key-suffix: ${{ inputs.arch == 'arm64' && '-arm64' || '' }}
      concurrency-suffix: -${{ inputs.arch }}
      docker-ci: false
      rbe: false
      request: ${{ inputs.request }}
      runs-on: ${{ inputs.arch == 'arm64' && (vars.ENVOY_ARM_VM || 'ubuntu-24.04-arm') || null }}
      trusted: ${{ inputs.trusted }}
      uploads: |
        packages.${{ inputs.arch }}: container/envoy/${{ inputs.arch }}
