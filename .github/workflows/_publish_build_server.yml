name: Publish (build server)

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      dockerhub-token:
      gpg-key:
      gpg-key-password:
    inputs:
      request:
        type: string
        required: true
      trusted:
        type: boolean
        required: true


concurrency:
  group: >-
    ${{ github.actor != 'trigger-release-envoy[bot]'
        && github.event.inputs.head_ref
        || github.run_id
    }}-${{ github.event.workflow.id }}-publish-build-server
  cancel-in-progress: true


jobs:
  # The release binaries, container images and packages of both arches, built by one job
  # (`release.multiarch`), which also signs the release.
  binary:
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
      # Only staged when signing (`signing`, below).
      gpg-key: ${{ secrets.gpg-key }}
      gpg-key-password: ${{ secrets.gpg-key-password }}
    permissions:
      actions: read
      contents: read
      packages: read
    name: Binary
    uses: ./.github/workflows/_run.yml
    with:
      arch: x64
      bazel-extra: >-
        --config=rbe
        ${{ fromJSON(inputs.request).run.release
            && (vars.ENVOY_CI_RELEASE || github.repository == 'envoyproxy/envoy')
            && !inputs.trusted
            && '--//distribution:signing-key=snakeoil'
            || '' }}
      # Sign the release of both arches in the same invocation.
      signing: >-
        ${{ fromJSON(inputs.request).run.release
            && (vars.ENVOY_CI_RELEASE || github.repository == 'envoyproxy/envoy')
            && true
            || false }}
      target: release.multiarch
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      concurrency-suffix: -x64
      rbe: true
      request: ${{ inputs.request }}
      bazel-rbe-jobs: ${{ fromJSON(inputs.request).config.ci.publish-jobs || 200 }}
      bazel-rbe-priority: ${{ fromJSON(inputs.request).config.ci.publish-priority || '' }}
      runs-on: >-
        ${{ fromJSON(inputs.request).config.ci.agent-publish || fromJSON(inputs.request).config.ci.agent-ubuntu }}
      timeout-minutes: 120
      trusted: ${{ inputs.trusted }}
      # Only what the pipeline uses: the images of both arches, and the signed release.
      uploads: |
        oci.x64:
          path: container/envoy/x64/build_images
          compression-level: 0
          retention-days: ${{ fromJSON(inputs.request).request.pr && 1 || 30 }}
        oci.arm64:
          path: container/envoy/arm64/build_images
          compression-level: 0
          retention-days: ${{ fromJSON(inputs.request).request.pr && 1 || 30 }}
        ${{ fromJSON(inputs.request).run.release
            && (vars.ENVOY_CI_RELEASE || github.repository == 'envoyproxy/envoy')
            && 'release.signed: {path: container/envoy/release.signed.tar.zst, compression-level: 0, retention-days: 30}'
            || '' }}
