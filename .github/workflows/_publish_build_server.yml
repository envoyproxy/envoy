name: Publish (build server)

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      dockerhub-token:
      gpg-key:
      gpg-key-password:
    inputs:
      arch:
        type: string
        required: true
      request:
        type: string
        required: true
      trusted:
        type: boolean
        required: true


concurrency:
  group: >-
    ${{ github.actor != 'trigger-release-envoy[bot]'
        && github.event.inputs.head_ref
        || github.run_id
    }}-${{ inputs.arch }}-${{ github.event.workflow.id }}-publish-build-server
  cancel-in-progress: true


jobs:
  binary:
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
      # Only staged when signing (`signing`, below).
      gpg-key: ${{ secrets.gpg-key }}
      gpg-key-password: ${{ secrets.gpg-key-password }}
    permissions:
      actions: read
      contents: read
      packages: read
    name: Binary
    uses: ./.github/workflows/_run.yml
    with:
      arch: ${{ inputs.arch }}
      bazel-extra: >-
        --config=rbe
        ${{ fromJSON(inputs.request).config.release-publish
            && fromJSON(inputs.request).config.release-publish-multiarch
            && fromJSON(inputs.request).run.release
            && (vars.ENVOY_CI_RELEASE || github.repository == 'envoyproxy/envoy')
            && !inputs.trusted
            && '--//distribution:signing-key=snakeoil'
            || '' }}
      # With `release-publish-multiarch`, sign the release of both arches in the same invocation
      # (as the release Sign packages job does otherwise).
      signing: >-
        ${{ fromJSON(inputs.request).config.release-publish
            && fromJSON(inputs.request).config.release-publish-multiarch
            && fromJSON(inputs.request).run.release
            && (vars.ENVOY_CI_RELEASE || github.repository == 'envoyproxy/envoy')
            && true
            || false }}
      target: >-
        ${{ fromJSON(inputs.request).config.release-publish
            && (fromJSON(inputs.request).config.release-publish-multiarch
                && 'release.multiarch'
                || 'release.publish')
            || 'release.server_only' }}
      # With `release-publish-multiarch`, it builds every arch (on whichever host).
      target-suffix: >-
        ${{ !(fromJSON(inputs.request).config.release-publish
              && fromJSON(inputs.request).config.release-publish-multiarch)
            && inputs.arch
            || '' }}
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      cache-build-image-key-suffix: ${{ inputs.arch == 'arm64' && '-arm64' || '' }}
      concurrency-suffix: -${{ inputs.arch }}
      rbe: true
      request: ${{ inputs.request }}
      bazel-rbe-jobs: ${{ fromJSON(inputs.request).config.ci.publish-jobs || 200 }}
      bazel-rbe-priority: ${{ fromJSON(inputs.request).config.ci.publish-priority || '' }}
      runs-on: >-
        ${{ inputs.arch == 'arm64' && (vars.ENVOY_ARM_VM || 'ubuntu-24.04-arm')
            || fromJSON(inputs.request).config.ci.agent-publish || fromJSON(inputs.request).config.ci.agent-ubuntu }}
      timeout-minutes: 120
      trusted: ${{ inputs.trusted }}
      # With `release-publish-multiarch`, only what the pipeline uses: the images of both arches (and
      # the signed release, below).
      uploads: |
        ${{ !(fromJSON(inputs.request).config.release-publish
              && fromJSON(inputs.request).config.release-publish-multiarch)
            && format('release.{0}: {{path: container/envoy/{0}/bin/, compression-level: 0}}', inputs.arch)
            || '' }}
        ${{ fromJSON(inputs.request).config.release-publish
            && format('oci.{0}: {{path: container/envoy/{0}/build_images, compression-level: 0}}', inputs.arch)
            || '' }}
        ${{ fromJSON(inputs.request).config.release-publish
            && !fromJSON(inputs.request).config.release-publish-multiarch
            && format('packages.{0}: {{path: container/envoy/{0}/packages, compression-level: 0}}', inputs.arch)
            || '' }}
        ${{ fromJSON(inputs.request).config.release-publish
            && fromJSON(inputs.request).config.release-publish-multiarch
            && 'oci.arm64: {path: container/envoy/arm64/build_images, compression-level: 0}'
            || '' }}
        ${{ fromJSON(inputs.request).config.release-publish
            && fromJSON(inputs.request).config.release-publish-multiarch
            && fromJSON(inputs.request).run.release
            && (vars.ENVOY_CI_RELEASE || github.repository == 'envoyproxy/envoy')
            && 'release.signed: {path: container/envoy/release.signed.tar.zst, compression-level: 0}'
            || '' }}

  # Branches whose binary jobs do not build the container images and packages (`release-publish`).
  docker:
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
    permissions:
      actions: read
      contents: read
      packages: read
    name: Docker OCI
    if: >-
      !fromJSON(inputs.request).config.release-publish
    needs:
    - binary
    uses: ./.github/workflows/_run.yml
    with:
      arch: ${{ inputs.arch }}
      target: docker
      target-suffix: ${{ inputs.arch }}
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      cache-build-image-key-suffix: ${{ inputs.arch == 'arm64' && '-arm64' || '' }}
      concurrency-suffix: -${{ inputs.arch }}
      downloads: |
        release.${{ inputs.arch }}: container/envoy/${{ inputs.arch }}/bin/
      request: ${{ inputs.request }}
      source: |
        export NO_BUILD_SETUP=1
        export ENVOY_DOCKER_IN_DOCKER=1
        export ENVOY_DOCKER_SAVE_IMAGE=true
        export ENVOY_OCI_DIR=build_images
      trusted: ${{ inputs.trusted }}
      uploads: |
        oci.${{ inputs.arch }}: {path: container/envoy/${{ inputs.arch }}/build_images, compression-level: 0}
      runs-on: >-
        ${{ inputs.arch == 'arm64' && (vars.ENVOY_ARM_VM || 'ubuntu-24.04-arm')
            || fromJSON(inputs.request).config.ci.agent-publish || fromJSON(inputs.request).config.ci.agent-ubuntu }}

  distribution:
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
    permissions:
      actions: read
      contents: read
      packages: read
    name: Packages
    if: >-
      !fromJSON(inputs.request).config.release-publish
    needs:
    - binary
    uses: ./.github/workflows/_run.yml
    with:
      arch: ${{ inputs.arch }}
      bazel-extra: >-
        --config=remote-cache
      downloads: |
        release.${{ inputs.arch }}: container/release/${{ inputs.arch }}/bin/
      target: distribution
      target-suffix: ${{ inputs.arch }}
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      cache-build-image-key-suffix: ${{ inputs.arch == 'arm64' && '-arm64' || '' }}
      concurrency-suffix: -${{ inputs.arch }}
      docker-ci: false
      rbe: false
      request: ${{ inputs.request }}
      runs-on: >-
        ${{ inputs.arch == 'arm64' && (vars.ENVOY_ARM_VM || 'ubuntu-24.04-arm')
            || fromJSON(inputs.request).config.ci.agent-publish || fromJSON(inputs.request).config.ci.agent-ubuntu }}
      trusted: ${{ inputs.trusted }}
      uploads: |
        packages.${{ inputs.arch }}: {path: container/envoy/${{ inputs.arch }}, compression-level: 0}
