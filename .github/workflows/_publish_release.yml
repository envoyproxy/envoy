name: Publish

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      dockerhub-token:
      dockerhub-write-token:
      ENVOY_CI_SYNC_APP_ID:
      ENVOY_CI_SYNC_APP_KEY:
      ENVOY_CI_PUBLISH_APP_ID:
      ENVOY_CI_PUBLISH_APP_KEY:
      gcp-docs-archive-key:
      gpg-key:
        required: true
      gpg-key-password:
        required: true
    inputs:
      dockerhub-username:
        type: string
        required: true
      request:
        type: string
        required: true
      trusted:
        type: boolean
        required: true

concurrency:
  group: >-
    ${{ github.actor != 'trigger-release-envoy[bot]'
        && github.event.inputs.head_ref
        || github.run_id
    }}-${{ github.event.workflow.id }}-publish
  cancel-in-progress: true


jobs:
  sign:
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
      gpg-key: ${{ secrets.gpg-key }}
      gpg-key-password: ${{ secrets.gpg-key-password }}
    permissions:
      actions: read
      contents: read
      packages: read
    if: ${{ vars.ENVOY_CI_RELEASE || github.repository == 'envoyproxy/envoy' }}
    name: Sign packages
    uses: ./.github/workflows/_run.yml
    with:
      target: release.signed
      bazel-extra: >-
        --config=rbe
        --noremote_upload_local_results
        --//distribution:x64-packages=//distribution:custom/x64/packages.x64.tar.gz
        --//distribution:arm64-packages=//distribution:custom/arm64/packages.arm64.tar.gz
        --//distribution:x64-release=//distribution:custom/x64/bin/release.tar.zst
        --//distribution:arm64-release=//distribution:custom/arm64/bin/release.tar.zst
        ${{ !inputs.trusted && '--//distribution:signing-key=snakeoil' || '' }}
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      downloads: |
        packages.arm64: container/envoy/arm64/
        packages.x64: container/envoy/x64/
        release.arm64: container/envoy/arm64/bin/
        release.x64: container/envoy/x64/bin/
      signing: true
      request: ${{ inputs.request }}
      source: |
        export NO_BUILD_SETUP=1
      trusted: ${{ inputs.trusted }}
      uploads: |
        release.signed: container/envoy/release.signed.tar.zst
      steps-pre: |
        - run: |
            mkdir -p distribution/custom
            cp -a %{{ runner.temp }}/container/envoy/x64 %{{ runner.temp }}/container/envoy/arm64 distribution/custom
          shell: bash

  container:
    secrets:
      dockerhub-write-token: ${{ secrets.dockerhub-write-token }}
    permissions:
      actions: read
      contents: read
      packages: read
    name: Publish container images
    uses: ./.github/workflows/_publish_release_container.yml
    with:
      dockerhub-repo: ${{ vars.DOCKERHUB_REPO || 'envoy' }}
      dockerhub-username: ${{ inputs.dockerhub-username }}
      dev: ${{ fromJSON(inputs.request).request.version.dev }}
      sha: ${{ fromJSON(inputs.request).request.sha }}
      target-branch: ${{ fromJSON(inputs.request).request.target-branch }}
      trusted: ${{ inputs.trusted }}
      version-major: ${{ fromJSON(inputs.request).request.version.major }}
      version-minor: ${{ fromJSON(inputs.request).request.version.minor }}
      version-patch: ${{ fromJSON(inputs.request).request.version.patch }}

  release:
    secrets:
      app-id: ${{ inputs.trusted && secrets.ENVOY_CI_PUBLISH_APP_ID || '' }}
      app-key: ${{ inputs.trusted && secrets.ENVOY_CI_PUBLISH_APP_KEY || '' }}
      dockerhub-token: ${{ secrets.dockerhub-token }}
    permissions:
      actions: read
      contents: read
      packages: read
    needs:
    - container
    - sign
    name: ${{ matrix.name || matrix.target }}
    uses: ./.github/workflows/_run.yml
    with:
      target: ${{ matrix.target }}
      rbe: false
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      downloads: |
        release.signed: container/release.signed
      source: ${{ matrix.source }}
      request: ${{ inputs.request }}
      steps-pre: ${{ matrix.steps-pre }}
      trusted: ${{ inputs.trusted }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: publish
          name: github

  docs:
    permissions:
      actions: read
      contents: read
      packages: read
    if: >-
      ${{ inputs.trusted
          && !fromJSON(inputs.request).request.version.dev
          && (vars.ENVOY_CI_RELEASE || github.repository == 'envoyproxy/envoy') }}
    needs:
    - release
    name: Build release docs
    uses: ./.github/workflows/_run.yml
    with:
      target: docs
      rbe: true
      bazel-extra: --config=rbe --config=docs-ci
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      request: ${{ inputs.request }}
      trusted: ${{ inputs.trusted }}
      timeout-minutes: 90
      source: |
        DOCS_VERSION_MAJOR=${{ fromJSON(inputs.request).request.version.major }}
        DOCS_VERSION_MINOR=${{ fromJSON(inputs.request).request.version.minor }}
        DOCS_VERSION_PATCH=${{ fromJSON(inputs.request).request.version.patch }}
        export DOCS_BUILD_RELEASE=1
        export BUILD_DOCS_TAG="v${DOCS_VERSION_MAJOR}.${DOCS_VERSION_MINOR}.${DOCS_VERSION_PATCH}"
        export BUILD_DOCS_SHA="${{ fromJSON(inputs.request).request.sha }}"
      uploads: |
        docs-release: generated/docs
      steps-post: |
        - uses: envoyproxy/toolshed/actions/jq@9bd3b300cf19f67cd2ef8b6e4aaa920f79894c24  # actions-v0.4.29
          with:
            output-path: generated/docs/gcs-metadata.json
            input-format: yaml
            input: |
              bucket: ${{ vars.GCS_DOCS_ARCHIVE_BUCKET }}
              sha: ${{ fromJSON(inputs.request).request.sha }}
              version: >-
                ${{ format(
                    'v{0}.{1}.{2}',
                    fromJSON(inputs.request).request.version.major,
                    fromJSON(inputs.request).request.version.minor,
                    fromJSON(inputs.request).request.version.patch
                ) }}
        - shell: bash
          run: |
            ln -sf %{{ github.workspace }}/generated %{{ runner.temp }}/generated

  docs-upload:
    secrets:
      gcp-key: ${{ secrets.gcp-docs-archive-key }}
    if: >-
      ${{ inputs.trusted
          && !fromJSON(inputs.request).request.version.dev
          && (vars.ENVOY_CI_RELEASE || github.repository == 'envoyproxy/envoy') }}
    needs:
    - docs
    uses: ./.github/workflows/_upload_gcs.yml
    with:
      artifacts: '["docs-release"]'
      request: ${{ inputs.request }}
      trusted: ${{ inputs.trusted }}
      bucket: ${{ vars.GCS_DOCS_ARCHIVE_BUCKET }}
      layout: version

  website:
    # Notify envoy-website to rebuild docs for dev versions.
    if: ${{ inputs.trusted && fromJSON(inputs.request).request.version.dev && github.repository == 'envoyproxy/envoy' }}
    needs:
    - docs-upload
    runs-on: ${{ fromJSON(inputs.request).config.ci.agent-ubuntu }}
    steps:
    - uses: envoyproxy/toolshed/actions/appauth@9bd3b300cf19f67cd2ef8b6e4aaa920f79894c24  # actions-v0.4.29
      id: appauth
      with:
        app_id: ${{ secrets.ENVOY_CI_SYNC_APP_ID }}
        key: ${{ secrets.ENVOY_CI_SYNC_APP_KEY }}
    - uses: envoyproxy/toolshed/actions/dispatch@9bd3b300cf19f67cd2ef8b6e4aaa920f79894c24  # actions-v0.4.29
      with:
        ref: main
        repository: envoyproxy/envoy-website
        token: ${{ steps.appauth.outputs.token }}
        workflow: envoy-sync.yaml
        inputs: |
          commit_sha: ${{ github.sha }}
