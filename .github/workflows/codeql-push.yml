name: CodeQL/push

permissions:
  contents: read

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.head_ref || github.run_id }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  SEARCH_FOLDER: //source/common/...

jobs:
  targets:
    if: github.repository == 'envoyproxy/envoy'
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    outputs:
      build_targets: ${{ steps.build-targets.outputs.targets }}
      cpp_changed: ${{ steps.detect.outputs.cpp_changed }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        fetch-depth: 2

    - name: Detect C++ changes
      id: detect
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" main 2>/dev/null
            TO_OTHER=FETCH_HEAD
        else
            TO_OTHER=HEAD^1
        fi
        echo "to_other=${TO_OTHER}" >> "$GITHUB_OUTPUT"
        if git diff --name-only HEAD "${TO_OTHER}" -- source/common/ envoy/ | grep -q .; then
            echo "cpp_changed=true" >> "$GITHUB_OUTPUT"
        else
            echo "cpp_changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Get build targets
      id: build-targets
      if: steps.detect.outputs.cpp_changed == 'true'
      env:
        TO_OTHER: ${{ steps.detect.outputs.to_other }}
      run: |
        # TODO(phlax): Shift this to an action
        compare_head () {
            while IFS= read -r line; do
                if [[ -n "$line" ]]; then
                    bazel query "rdeps($SEARCH_FOLDER, $line, 1)" 2>/dev/null
                fi
            done < <(git diff --name-only HEAD "${TO_OTHER}" -- source/common/* envoy/*)
        }
        BUILD_TARGETS="$(compare_head | grep -v '\.cc\|\.h' | sort -u | head -n 3)"
        if [[ -z "$BUILD_TARGETS" ]]; then
            BUILD_TARGETS="//source/common/common:assert_lib"
        fi
        {
            echo 'targets<<EOF'
            sed 's|^//|@envoy//|' <<< "$BUILD_TARGETS"
            echo 'EOF'
        } >> "$GITHUB_OUTPUT"

  CodeQL-Build:
    if: needs.targets.outputs.cpp_changed == 'true'
    needs: targets
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: read
    uses: ./.github/workflows/_codeql.yml
    with:
      targets: ${{ needs.targets.outputs.build_targets }}

  CodeQL-Noop:
    if: needs.targets.outputs.cpp_changed != 'true'
    needs: targets
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

    # No-op analysis satisfies Scorecard SAST when no C++ changes are present.
    - name: Initialize CodeQL (noop)
      uses: github/codeql-action/init@87557b9c84dde89fdd9b10e88954ac2f4248e463  # codeql-bundle-v4.36.1
      with:
        languages: javascript
        trap-caching: false

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@87557b9c84dde89fdd9b10e88954ac2f4248e463  # codeql-bundle-v4.36.1
