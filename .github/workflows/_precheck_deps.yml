name: Precheck/deps

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      dockerhub-token:
    inputs:
      request:
        type: string
        required: true
      trusted:
        type: boolean
        required: true

concurrency:
  group: ${{ github.head_ref || github.run_id }}-${{ github.workflow }}-deps
  cancel-in-progress: true


jobs:
  deps:
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/_run.yml
    name: ${{ matrix.target }}
    with:
      bazel-extra: '--config=rbe'
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      concurrency-suffix: -${{ matrix.target }}
      docker-ci: false
      request: ${{ inputs.request }}
      error-match: |
        ERROR
        error:
        Error:
        FAILED
        FAIL:
      rbe: true
      target: ${{ matrix.target }}
      trusted: ${{ inputs.trusted }}
    strategy:
      matrix:
        include:
        - target: deps
