name: Dependency/Scan dependencies for CVEs

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      gcs-cve-key:
        required: true
    inputs:
      cve-data-path:
        default: tools/dependency/cve_data
        type: string
      scheduled:
        default: false
        type: boolean


env:
  _TS_0: &ts-gcp-setup envoyproxy/toolshed/actions/gcp/setup@e8ab1b7c39d474eadc1b9340055df55407d2c77e  # actions-v0.4.33

jobs:
  cve-data:
    name: Scan dependencies for CVEs
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set vars
      id: vars
      run: |
        echo "cve-data-path=${{ inputs.cve-data-path }}" > $GITHUB_OUTPUT
    - uses: *ts-gcp-setup
      name: Setup GCP
      with:
        key: ${{ secrets.gcs-cve-key }}
    - name: Create CVE data directory
      run: |
        mkdir -p ${{ steps.vars.outputs.cve-data-path }}
    - name: Download (sync) from GCS bucket
      run: |
        gsutil -mq rsync -r \
          "gs://${{ vars.GCS_CVE_BUCKET }}" \
          "${{ steps.vars.outputs.cve-data-path }}"
    - name: Run CVE dependency scanner
      run: |
        bazel test --config=ci --config=cves //tools/dependency:cves.test
