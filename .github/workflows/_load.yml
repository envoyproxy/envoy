name: Request/load

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      app-id:
        required: true
      app-key:
        required: true

    inputs:
      agent-ubuntu:
        type: string
        default: ubuntu-24.04
      check-name:
        type: string
        required: true
      check-title:
        type: string
        default:
      head-sha:
        type: string
        default:
      run-id:
        type: string
        default: ${{ github.event.workflow_run.id }}
      runs-after:
        type: boolean
        default: false
      # Save the id of the request run in this run, for a workflow triggered by this run
      # (`runs-after`).
      save-request:
        type: boolean
        default: false
      template-request-summary:
        type: string
        default: |
          ## \($linkedTitle)

          \($summary)

          \($extra)

    outputs:
      build-image:
        value: ${{ jobs.request.outputs.build-image }}
      build-image-mobile:
        value: ${{ jobs.request.outputs.build-image-mobile }}
      check-id:
        value: ${{ jobs.request.outputs.check-id }}
      check-name:
        value: ${{ inputs.check-name }}
      request:
        value: ${{ jobs.request.outputs.request }}
      run-id:
        value: ${{ inputs.run-id }}
      trusted:
        value: ${{ jobs.request.outputs.trusted }}

concurrency:
  group: |
    ${{ github.actor != 'trigger-release-envoy[bot]'
        && github.head_ref
        || github.run_id
    }}-${{ github.workflow }}-env
  cancel-in-progress: true

env:
  CI_DEBUG: ${{ vars.CI_DEBUG && true || false }}


jobs:
  request:
    if: ${{ github.repository == 'envoyproxy/envoy' || vars.ENVOY_CI }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      build-image: ${{ toJSON(fromJSON(steps.request-output.outputs.value).request.build-image) }}
      build-image-mobile: ${{ fromJSON(steps.request-output.outputs.value).request.build-image-mobile }}
      check-id: ${{ fromJSON(steps.request-output.outputs.value).check.check-id }}
      request: ${{ steps.request-output.outputs.value }}
      trusted: ${{ fromJSON(steps.request-output.outputs.value).request.trusted }}
      skip: ${{ fromJSON(steps.request-output.outputs.value).check.action != 'RUN' }}
    steps:
    # A workflow that runs after another `workflow_run` workflow is triggered by that run, and
    # nothing records what triggered it. The triggering run saves the id of its request run
    # (`save-request`). Anything in that run could have written it: the request is only trusted
    # once it has been checked below.
    - uses: envoyproxy/toolshed/actions/github/artifact/download@0b8831c802e19cf74905c23a37b7b3caa5e6ad90  # actions-v0.4.30
      name: Download request id
      if: ${{ inputs.runs-after == true }}
      with:
        name: request-id
        path: ${{ runner.temp }}
        run-id: ${{ inputs.run-id }}
    - run: |
        REQUEST_ID="$(cat "${RUNNER_TEMP}/request-id")"
        if [[ ! "$REQUEST_ID" =~ ^[0-9]+$ ]]; then
            echo "Run ${RUN_ID} saved an invalid request id" >&2
            exit 1
        fi
        echo "Request run ${REQUEST_ID}, from run ${RUN_ID}"
        echo "value=${REQUEST_ID}" >> "$GITHUB_OUTPUT"
      id: run-id
      if: ${{ inputs.runs-after == true }}
      env:
        RUN_ID: ${{ inputs.run-id }}

    # Load env data
    # Handle any failure in triggering job
    # Remove any `checks` we dont care about
    # Prepare a check request
    - uses: envoyproxy/toolshed/actions/github/env/load@0b8831c802e19cf74905c23a37b7b3caa5e6ad90  # actions-v0.4.30
      name: Load env
      id: data
      with:
        run-id: ${{ steps.run-id.outputs.value || inputs.run-id }}
        check-name: ${{ inputs.check-name }}
        head-sha: ${{ inputs.head-sha }}
      env:
        GH_TOKEN: ${{ github.token }}

    - run: |
        mkdir -p "${RUNNER_TEMP}/request-id-save"
        echo "${RUN_ID}" > "${RUNNER_TEMP}/request-id-save/request-id"
      name: Save request id
      if: ${{ inputs.save-request == true }}
      env:
        RUN_ID: ${{ inputs.run-id }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      name: Upload request id
      if: ${{ inputs.save-request == true }}
      with:
        name: request-id
        path: ${{ runner.temp }}/request-id-save/request-id
        if-no-files-found: error

    #  Update the check
    - uses: envoyproxy/toolshed/actions/appauth@0b8831c802e19cf74905c23a37b7b3caa5e6ad90  # actions-v0.4.30
      name: Appauth
      id: appauth
      with:
        app_id: ${{ secrets.app-id }}
        key: ${{ secrets.app-key }}

    # The environment comes from a trusted request run (toolshed env/load validates the run). Check
    # that it is the request of the triggering run: the triggering run updated the request's check
    # (`external_id`) with the app token, which nothing else in that run has.
    - run: |
        CHECK="$(gh api --paginate \
                    "repos/${GH_REPO}/commits/${SHA}/check-runs?filter=all&per_page=100" \
                    --jq ".check_runs[] | select(.app.slug != \"github-actions\" and .external_id == \"${RUN_ID}\") | .id")"
        if [[ -z "$CHECK" ]]; then
            echo "Request run ${REQUEST_ID} (${SHA}) is not the request of run ${RUN_ID}" >&2
            exit 1
        fi
        echo "Request run ${REQUEST_ID} (${SHA}) is the request of run ${RUN_ID}"
      name: Check request
      if: >-
        inputs.runs-after == true
        && fromJSON(steps.data.outputs.data).data.check.action == 'RUN'
      env:
        GH_TOKEN: ${{ steps.appauth.outputs.token }}
        GH_REPO: ${{ github.repository }}
        REQUEST_ID: ${{ steps.run-id.outputs.value }}
        RUN_ID: ${{ inputs.run-id }}
        SHA: ${{ fromJSON(steps.data.outputs.data).data.request.sha }}

    - uses: envoyproxy/toolshed/actions/github/checks@0b8831c802e19cf74905c23a37b7b3caa5e6ad90  # actions-v0.4.30
      name: Update check
      if: ${{ fromJSON(steps.data.outputs.data).data.check.action == 'RUN' }}
      with:
        action: update
        checks: ${{ toJSON(fromJSON(steps.data.outputs.data).checks) }}
        token: ${{ steps.appauth.outputs.token }}

    - uses: envoyproxy/toolshed/actions/jq@0b8831c802e19cf74905c23a37b7b3caa5e6ad90  # actions-v0.4.30
      name: Print request summary
      with:
        input: |
          {"action": ${{ toJSON(fromJSON(steps.data.outputs.data).data.check.action) }},
           "summary": ${{ toJSON(fromJSON(steps.data.outputs.data).data.summary) }}}
        output-path: GITHUB_STEP_SUMMARY
        options: -r
        filter: |
          .action as $action
          | .summary as $summary
          | if ($action != "RUN") then
              "### ${{ github.workflow }} was skipped"
            else "" end
          | . as $extra
          | $summary["linked-title"] as $linkedTitle
          | $summary.summary as $summary
          | "${{ inputs.template-request-summary }}"

    - uses: envoyproxy/toolshed/actions/jq@0b8831c802e19cf74905c23a37b7b3caa5e6ad90  # actions-v0.4.30
      id: request-output
      name: Load request
      with:
        input: |
          {"check": ${{ toJSON(fromJSON(steps.data.outputs.data).data.check) }},
           "config": ${{ toJSON(fromJSON(steps.data.outputs.data).data.config) }},
           "request": ${{ toJSON(fromJSON(steps.data.outputs.data).data.request) }},
           "run": ${{ toJSON(fromJSON(steps.data.outputs.data).data.run) }},
           "summary_title": ${{ toJSON(fromJSON(steps.data.outputs.data).data.summary.title) }}}
        filter: |
          .
          | .summary = {title: .summary_title}
          | del(.request.message, .summary_title)
        print-result: ${{ fromJSON(env.CI_DEBUG || 'false') && true || false }}
