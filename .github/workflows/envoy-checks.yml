name: Envoy/Checks

permissions:
  contents: read

on:
  workflow_run:
    workflows:
    # Workaround issue with PRs not triggering tertiary workflows
    - Request
    # - Envoy/Prechecks
    types:
    - completed

concurrency:
  group: >-
    ${{ ((github.event.workflow_run.head_branch == 'main'
          || startsWith(github.event.workflow_run.head_branch, 'release/v'))
          && github.event.repository.full_name == github.repository)
        && github.run_id
        || github.event.workflow_run.head_branch }}-${{ github.event.repository.full_name }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CI_DEBUG: ${{ vars.CI_DEBUG }}


jobs:
  load:
    secrets:
      app-key: ${{ secrets.ENVOY_CI_APP_KEY }}
      app-id: ${{ secrets.ENVOY_CI_APP_ID }}
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    if: |
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.repository.full_name == github.repository
      && contains(fromJSON('["pull_request_target", "push", "schedule"]'), github.event.workflow_run.event)
      && (github.repository == 'envoyproxy/envoy' || vars.ENVOY_CI)
    uses: ./.github/workflows/_load.yml
    with:
      check-name: checks
      # head-sha: ${{ github.sha }}

  build:
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    name: Check (${{ needs.load.outputs.request && fromJSON(needs.load.outputs.request).summary.title || 'SKIPPED' }})
    uses: ./.github/workflows/_check_build.yml
    if: ${{ fromJSON(needs.load.outputs.request).run.check-build }}
    needs:
    - load
    with:
      request: ${{ needs.load.outputs.request }}
      trusted: ${{ needs.load.outputs.trusted && fromJSON(needs.load.outputs.trusted) || false }}

  # These jobs are invoked separately as they are allowed to fail. If that is not the case they should be moved to the build matrix.
  build-openssl:
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    name: Check (${{ needs.load.outputs.request && fromJSON(needs.load.outputs.request).summary.title || 'SKIPPED' }})
    uses: ./.github/workflows/_check_build_openssl.yml
    if: >-
      fromJSON(needs.load.outputs.request).run.check-build-openssl
      || fromJSON(needs.load.outputs.request).run.check-build-openssl-presubmit
    needs:
    - load
    with:
      request: ${{ needs.load.outputs.request }}
      trusted: ${{ needs.load.outputs.trusted && fromJSON(needs.load.outputs.trusted) || false }}

  coverage:
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      gcp-key: >-
        ${{ needs.load.outputs.trusted
            && fromJSON(needs.load.outputs.trusted)
            && secrets.GCP_SERVICE_ACCOUNT_KEY_TRUSTED
            || secrets.GCP_SERVICE_ACCOUNT_KEY }}
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    name: Check (${{ needs.load.outputs.request && fromJSON(needs.load.outputs.request).summary.title || 'SKIPPED' }})
    uses: ./.github/workflows/_check_coverage.yml
    if: ${{ fromJSON(needs.load.outputs.request).run.check-coverage }}
    needs:
    - load
    with:
      request: ${{ needs.load.outputs.request }}
      trusted: ${{ needs.load.outputs.trusted && fromJSON(needs.load.outputs.trusted) || false }}

  runtime:
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    name: Check (${{ needs.load.outputs.request && fromJSON(needs.load.outputs.request).summary.title || 'SKIPPED' }})
    uses: ./.github/workflows/_check_runtime.yml
    if: ${{ fromJSON(needs.load.outputs.request).run.check-runtime }}
    needs:
    - load
    with:
      request: ${{ needs.load.outputs.request }}
      trusted: ${{ needs.load.outputs.trusted && fromJSON(needs.load.outputs.trusted) || false }}

  san:
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    name: Check (${{ needs.load.outputs.request && fromJSON(needs.load.outputs.request).summary.title || 'SKIPPED' }})
    uses: ./.github/workflows/_check_san.yml
    if: ${{ fromJSON(needs.load.outputs.request).run.check-san }}
    needs:
    - load
    with:
      request: ${{ needs.load.outputs.request }}
      trusted: ${{ needs.load.outputs.trusted && fromJSON(needs.load.outputs.trusted) || false }}

  request:
    secrets:
      app-id: ${{ secrets.ENVOY_CI_APP_ID }}
      app-key: ${{ secrets.ENVOY_CI_APP_KEY }}
      slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    if: |
      always()
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.repository.full_name == github.repository
      && contains(fromJSON('["pull_request_target", "push", "schedule"]'), github.event.workflow_run.event)
      && (fromJSON(needs.load.outputs.request).run.check-build
          || fromJSON(needs.load.outputs.request).run.check-build-openssl
          || fromJSON(needs.load.outputs.request).run.check-build-openssl-presubmit
          || fromJSON(needs.load.outputs.request).run.check-coverage
          || fromJSON(needs.load.outputs.request).run.check-san)
    needs:
    - load
    - build
    - build-openssl
    - coverage
    - runtime
    - san
    uses: ./.github/workflows/_finish.yml
    with:
      needs: ${{ toJSON(needs) }}
      allowed-to-fail: |
        build-openssl
      slack-channel: '#envoy-ci'
      slack-channel-allowed-failure: '#envoy-openssl'

  datadog:
    permissions:
      actions: read
      contents: read
    if: |
      always()
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.repository.full_name == github.repository
      && contains(fromJSON('["pull_request_target", "push", "schedule"]'), github.event.workflow_run.event)
      && (fromJSON(needs.load.outputs.request).run.check-build
          || fromJSON(needs.load.outputs.request).run.check-build-openssl
          || fromJSON(needs.load.outputs.request).run.check-build-openssl-presubmit
          || fromJSON(needs.load.outputs.request).run.check-coverage
          || fromJSON(needs.load.outputs.request).run.check-san)
    needs:
    - load
    - build
    - build-openssl
    - coverage
    - runtime
    - san
    runs-on: ubuntu-24.04
    name: Datadog CI Visibility
    steps:
      - name: Download JUnit XML artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: junit-xml-*
          merge-multiple: true
          path: junit-reports

      - name: Check for report files
        id: check-files
        run: |
          if [ -d junit-reports ] && [ "$(find junit-reports -name '*.xml' | wc -l)" -gt 0 ]; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "No JUnit reports found to upload."
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Upload test results to Datadog CI Visibility
        if: steps.check-files.outputs.has_reports == 'true'
        uses: datadog/github-action-upload-junit@7f8cd36e2f694dbf069177a64112e75306cd10e9 # v1.4.0
        with:
          api-key: ${{ secrets.DD_API_KEY }}
          service: envoy-ci
          files: "junit-reports/**/*.xml"
