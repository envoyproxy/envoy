name: Envoy/JUnit

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      since-hours:
        description: Collect runs completed in the last N hours.
        type: number
        default: 2
      until-hours:
        description: End the window N hours ago rather than now.
        type: number
        default: 0
      slice-hours:
        description: >-
          Split the window into jobs of N hours each, to backfill (0 for one job). A day of
          runs takes a job about 70 minutes.
        type: number
        default: 0
      max-parallel:
        description: How many of the window's jobs to run at once.
        type: string
        default: "2"
      artifact:
        description: Keep the collected XML as an artifact.
        type: boolean
        default: true
      workflows:
        description: Comma-separated workflow names to collect from.
        type: string
        default: Envoy/Checks,Envoy/Prechecks
      datadog-service:
        description: Datadog service name to upload test results under.
        type: string
        default: envoy-ci

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


jobs:
  slices:
    # The window as fixed times, in slices, as the jobs for them do not all start at once.
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      slices: ${{ steps.slices.outputs.slices }}
    steps:
    - id: slices
      run: |
        python3 - >> "$GITHUB_OUTPUT" <<'EOF'
        import datetime
        import json
        import os

        now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
        since = now - datetime.timedelta(hours=float(os.environ["SINCE_HOURS"]))
        until = now - datetime.timedelta(hours=float(os.environ["UNTIL_HOURS"]))
        size = datetime.timedelta(hours=float(os.environ["SLICE_HOURS"])) or until - since
        slices = []
        # Newest first.
        while until > since and len(slices) < 256:
            start = max(since, until - size)
            slices.append({"since": start.strftime("%Y-%m-%dT%H:%M:%SZ"),
                           "until": until.strftime("%Y-%m-%dT%H:%M:%SZ")})
            until = start
        print(f"slices={json.dumps(slices)}")
        EOF
      env:
        SINCE_HOURS: ${{ inputs.since-hours || 2 }}
        UNTIL_HOURS: ${{ inputs.until-hours || 0 }}
        SLICE_HOURS: ${{ inputs.slice-hours || 0 }}

  collect:
    # Manually triggered, not run on each CI run, so collecting never slows CI down. Each job
    # takes a slice of the window and pulls the test.xml of every test the matched runs' Bazel
    # invocations actually executed, from EngFlow.
    needs: slices
    if: needs.slices.outputs.slices != '[]'
    name: collect (${{ matrix.slice.since }} to ${{ matrix.slice.until }})
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max-parallel || '2') }}
      matrix:
        slice: ${{ fromJSON(needs.slices.outputs.slices) }}
    env:
      # So that the step logs are timestamped as things happen.
      PYTHONUNBUFFERED: "1"
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        sparse-checkout: ci/junit
    - name: Collect JUnit XML from EngFlow
      run: >-
        python3 ci/junit/collect.py
        --repo "${{ github.repository }}"
        --since "${{ matrix.slice.since }}"
        --until "${{ matrix.slice.until }}"
        --workflows "${{ inputs.workflows || 'Envoy/Checks,Envoy/Prechecks' }}"
        --out junit
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: inputs.artifact
      with:
        name: junit-${{ strategy.job-index }}
        path: junit
        if-no-files-found: warn
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
      with:
        node-version: '22'
    - name: Restore Datadog upload watermark
      # Which run ids a previous dispatch already uploaded, so two overlapping windows (e.g.
      # re-running this manually before narrowing the window) don't re-upload the same run's
      # results. The slices of one dispatch do not overlap, so it does not matter that the jobs
      # for them each save their own.
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .datadog-watermark.json
        key: datadog-watermark-${{ github.run_id }}-${{ strategy.job-index }}
        restore-keys: datadog-watermark-
    - name: Upload JUnit XML to Datadog
      # Best effort, same as collection above: a Datadog hiccup shouldn't fail the run.
      continue-on-error: true
      run: >-
        python3 ci/junit/upload_datadog.py
        --repo "${{ github.repository }}"
        --service "${{ inputs.datadog-service || 'envoy-ci' }}"
        --junit-dir junit
        --watermark .datadog-watermark.json
      env:
        DD_API_KEY: ${{ secrets.DD_API_KEY }}
    - name: Save Datadog upload watermark
      if: always()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .datadog-watermark.json
        key: datadog-watermark-${{ github.run_id }}-${{ strategy.job-index }}
