name: Envoy/JUnit

# NOT FOR MERGE: a probe of the Datadog API with the CI key, on a branch of its own.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      method:
        type: string
        default: GET
      path:
        description: API path, e.g. /api/v1/validate
        type: string
        default: /api/v1/validate
      body:
        description: JSON request body, if any.
        type: string
        default: ""
      jq:
        description: jq filter for the response.
        type: string
        default: .
      batch-url:
        description: URL of a JSON array of {name, method, path, body} calls to make, in place of one API call.
        type: string
        default: ""
      dashboard-id:
        description: A dashboard to change with the jq program in dashboard-edit, in place of an API call.
        type: string
        default: ""
      dashboard-edit:
        description: jq program applied to the dashboard's definition before it is put back.
        type: string
        default: .
      xml:
        description: A JUnit XML document to upload under the envoy-ci-probe service, in place of an API call.
        type: string
        default: ""
      xml-name:
        type: string
        default: probe_test.xml
      upload-args:
        type: string
        default: ""

jobs:
  api:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Upload a probe document
      if: inputs.xml != ''
      run: |
        mkdir probe && cd probe
        printf '%s' "$XML" > "$XML_NAME"
        read -ra args <<< "$UPLOAD_ARGS"
        npx --yes @datadog/datadog-ci@5.25.0 junit upload --service envoy-ci-probe --skip-git-metadata-upload "${args[@]}" "$XML_NAME"
      env:
        DD_API_KEY: ${{ secrets.DD_API_KEY }}
        XML: ${{ inputs.xml }}
        XML_NAME: ${{ inputs.xml-name }}
        UPLOAD_ARGS: ${{ inputs.upload-args }}
        GIT_CEILING_DIRECTORIES: ${{ github.workspace }}
    - name: Make a batch of API calls
      if: inputs.batch-url != ''
      run: |
        curl -sSL --max-time 60 -o batch.json "$BATCH_URL"
        n=$(jq length batch.json)
        for i in $(seq 0 $((n - 1))); do
            name=$(jq -r ".[$i].name" batch.json)
            method=$(jq -r ".[$i].method // \"POST\"" batch.json)
            path=$(jq -r ".[$i].path" batch.json)
            jq -c ".[$i].body" batch.json > body.json
            code=$(curl -sS --max-time 120 -X "$method" -H "DD-API-KEY: $DD_API_KEY" -H "DD-APPLICATION-KEY: $DD_APP_KEY" \
                -H "Content-Type: application/json" --data @body.json -o response.json -w '%{http_code}' "https://api.datadoghq.com${path}")
            echo "RESULT $i $code $name :: $(jq -c "$JQ" response.json 2>/dev/null | head -c 600)"
        done
      env:
        DD_API_KEY: ${{ secrets.DD_API_KEY }}
        DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        BATCH_URL: ${{ inputs.batch-url }}
        JQ: ${{ inputs.jq }}
    - name: Edit a dashboard
      if: inputs.dashboard-id != ''
      run: |
        auth=(-H "DD-API-KEY: $DD_API_KEY" -H "DD-APPLICATION-KEY: $DD_APP_KEY" -H "Content-Type: application/json")
        url="https://api.datadoghq.com/api/v1/dashboard/${DASHBOARD_ID}"
        curl -sS --max-time 120 "${auth[@]}" -o before.json -w 'GET HTTP %{http_code}\n' "$url"
        jq "$EDIT" before.json > after.json
        curl -sS --max-time 120 -X PUT "${auth[@]}" --data @after.json -o result.json -w 'PUT HTTP %{http_code}\n' "$url"
        jq '{id, title, modified_at, errors}' result.json
      env:
        DD_API_KEY: ${{ secrets.DD_API_KEY }}
        DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        DASHBOARD_ID: ${{ inputs.dashboard-id }}
        EDIT: ${{ inputs.dashboard-edit }}
    - name: Call the Datadog API
      if: inputs.xml == '' && inputs.dashboard-id == '' && inputs.batch-url == ''
      run: |
        args=(-sS --max-time 120 -X "$METHOD" -H "DD-API-KEY: $DD_API_KEY" -H "Content-Type: application/json"
              -o response.json -w 'HTTP %{http_code} %{size_download} bytes\n')
        if [[ -n "$DD_APP_KEY" ]]; then
            args+=(-H "DD-APPLICATION-KEY: $DD_APP_KEY")
        fi
        if [[ -n "$BODY" ]]; then
            args+=(--data "$BODY")
        fi
        curl "${args[@]}" "https://api.datadoghq.com${API_PATH}"
        jq "$JQ" response.json 2>/dev/null | head -c 200000 || head -c 20000 response.json
      env:
        DD_API_KEY: ${{ secrets.DD_API_KEY }}
        DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        METHOD: ${{ inputs.method }}
        API_PATH: ${{ inputs.path }}
        BODY: ${{ inputs.body }}
        JQ: ${{ inputs.jq }}
