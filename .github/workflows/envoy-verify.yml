name: Envoy/Verify

permissions:
  contents: read

on:
  workflow_run:
    workflows:
    - Envoy/Publish
    types:
    - completed
  # Verify the request of a completed Envoy/Publish run again, against its artifacts, eg to rerun or
  # develop the verify jobs (from this branch's workflows) without waiting for a new build.
  workflow_dispatch:
    inputs:
      publish-run-id:
        description: Envoy/Publish run to verify
        type: string
        required: true

# `github.event.workflow_run` is the Envoy/Publish run, which GitHub records against the default
# branch whatever the request was, so it cannot group runs by PR: group by that run instead. The
# request is found from the id that run saves, and checked (`_load.yml` `runs-after`).
concurrency:
  group: ${{ github.event.workflow_run.id || inputs.publish-run-id }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CI_DEBUG: ${{ vars.CI_DEBUG }}


jobs:
  load:
    secrets:
      app-key: ${{ secrets.ENVOY_CI_APP_KEY }}
      app-id: ${{ secrets.ENVOY_CI_APP_ID }}
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    if: |
      (github.event_name == 'workflow_dispatch'
       || (contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
           && github.event.workflow_run.repository.full_name == github.repository))
      && (github.repository == 'envoyproxy/envoy' || vars.ENVOY_CI)
    uses: ./.github/workflows/_load.yml
    with:
      check-name: verify
      run-id: ${{ github.event.workflow_run.id || inputs.publish-run-id }}
      runs-after: true

  verify:
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      actions: read
      contents: read
      packages: read
    if: >-
      fromJSON(needs.load.outputs.request).run.verify
      && (github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'success')
    needs:
    - load
    uses: ./.github/workflows/_publish_verify.yml
    name: Verify
    with:
      downloads-run-id: ${{ github.event.workflow_run.id || inputs.publish-run-id }}
      request: ${{ needs.load.outputs.request }}
      trusted: ${{ needs.load.outputs.trusted && fromJSON(needs.load.outputs.trusted) || false }}

  request:
    secrets:
      app-id: ${{ secrets.ENVOY_CI_APP_ID }}
      app-key: ${{ secrets.ENVOY_CI_APP_KEY }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    # Only report on a `verify` check: release branches whose config has none still run the verify
    # jobs, unreported.
    if: |
      !cancelled()
      && needs.load.result == 'success'
      && fromJSON(needs.load.outputs.request).run.verify
      && fromJSON(needs.load.outputs.request).check.action == 'RUN'
    needs:
    - load
    - verify
    uses: ./.github/workflows/_finish.yml
    with:
      needs: ${{ toJSON(needs) }}
