name: Publish (build)

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      dockerhub-token:
      gcp-key:
    inputs:
      docs:
        type: boolean
        default: true
      server:
        type: boolean
        default: true
      request:
        type: string
        required: true
      trusted:
        type: boolean
        required: true


concurrency:
  group: >-
    ${{ github.actor != 'trigger-release-envoy[bot]'
        && github.event.inputs.head_ref
        || github.run_id
    }}-${{ github.event.workflow.id }}-publish-build
  cancel-in-progress: true


jobs:
  server:
    if: inputs.server
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
    permissions:
      actions: read
      contents: read
      packages: read
    name: Server
    uses: ./.github/workflows/_publish_build_server.yml
    strategy:
      fail-fast: false
      matrix:
        arch:
        - x64
        - arm64
    with:
      arch: ${{ matrix.arch }}
      request: ${{ inputs.request }}
      trusted: ${{ inputs.trusted }}

  docs:
    if: inputs.docs
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
      gcp-key: ${{ secrets.gcp-key }}
    permissions:
      actions: read
      contents: read
      packages: read
    name: Docs
    uses: ./.github/workflows/_publish_build_docs.yml
    with:
      docs: ${{ inputs.docs }}
      request: ${{ inputs.request }}
      trusted: ${{ inputs.trusted }}
    strategy:
      matrix:
        target:
        - docs
