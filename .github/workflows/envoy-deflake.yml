name: Envoy/deflake

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Bazel target to test'
        type: string
        required: true
      test:
        description: 'C++ test'
        type: string
        required: true
      bazel-args:
        description: Toolchain/test type
        type: string
        default: ''
      runs:
        description: 'Number of runs to test'
        type: number
        default: 1000
      pr:
        description: 'Pull request to test (merge commit); takes precedence over ref'
        type: string
        default: ''
      ref:
        description: 'Ref to test: full sha, branch, tag or refs/pull/N/head (default: this branch)'
        type: string
        default: ''
      repository:
        description: 'Repository (owner/name) to fetch ref from (default: this repository); ignored for pr'
        type: string
        default: ''
      timeout-minutes:
        description: 'Job timeout in minutes'
        type: number
        default: 360


jobs:
  env:
    secrets:
      lock-app-key: ${{ secrets.ENVOY_CI_MUTEX_APP_KEY }}
      lock-app-id: ${{ secrets.ENVOY_CI_MUTEX_APP_ID }}
    permissions:
      contents: read
    uses: ./.github/workflows/_load_env.yml

  deflake:
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      actions: read
      contents: read
      packages: read
    needs: env
    uses: ./.github/workflows/_run.yml
    with:
      bazel-extra: >-
        --config=rbe
        ${{ inputs.bazel-args }}
      checkout-pr: ${{ inputs.pr }}
      checkout-ref: ${{ inputs.ref }}
      checkout-repository: ${{ inputs.repository }}
      rbe: true
      request: ${{ needs.env.outputs.request }}
      target: deflake
      timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
      # Testing a pull request, ref or fork branch runs code that is not on this branch, so the
      # job is untrusted, as in PR CI: no app token, no deploy key. Unlike PR CI the run keeps
      # this branch's Actions cache scope, so only dispatch code you would push to this
      # repository.
      trusted: ${{ !(inputs.pr || inputs.ref) }}
      steps-pre: |
        - shell: bash
          run: |
            echo ENVOY_DEFLAKE_JOBS=300 >> $GITHUB_ENV
            echo ENVOY_DEFLAKE_RUNS=${{ inputs.runs }} >> $GITHUB_ENV
            echo ENVOY_DEFLAKE_TARGET=${{ inputs.target }} >> $GITHUB_ENV
            echo ENVOY_DEFLAKE_TEST=${{ inputs.test }} >> $GITHUB_ENV
