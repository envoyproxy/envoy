name: Check/build (OpenSSL)

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      dockerhub-token:
    inputs:
      request:
        type: string
        required: true
      trusted:
        type: boolean
        required: true

concurrency:
  group: ${{ github.head_ref || github.run_id }}-${{ github.workflow }}-build-openssl
  cancel-in-progress: true


jobs:
  # The jobs are set by the `check-build-openssl-*` run flags in the target branch's
  # .github/config.yml, which _request.yml turns into this matrix.
  build:
    if: fromJSON(inputs.request).config.ci.check-build-openssl[0] && true || false
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/_run.yml
    name: ${{ matrix.name }}
    with:
      bazel-extra: '--config=rbe'
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      concurrency-suffix: -${{ matrix.target }}
      # Only respected by branches that predate the `openssl.*` targets.
      docker-ci: false
      error-match: |
        ERROR
        error:
        Error:
        FAILED
        FAIL:
      rbe: true
      request: ${{ inputs.request }}
      target: ${{ matrix.target }}
      timeout-minutes: 180
      trusted: ${{ inputs.trusted }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.request).config.ci.check-build-openssl }}
