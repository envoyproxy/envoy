name: Check/build (OpenSSL)

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      dockerhub-token:
    inputs:
      request:
        type: string
        required: true
      trusted:
        type: boolean
        required: true

concurrency:
  group: ${{ github.head_ref || github.run_id }}-${{ github.workflow }}-build-openssl
  cancel-in-progress: true


jobs:
  build:
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/_run.yml
    name: ${{ matrix.name || matrix.target }}
    with:
      bazel-cache: true
      bazel-extra: '--config=rbe'
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      concurrency-suffix: -${{ matrix.target }}
      docker-ci: ${{ matrix.docker-ci || false }}
      error-match: |
        ERROR
        error:
        Error:
      rbe: true
      request: ${{ inputs.request }}
      catch-errors: ${{ matrix.catch-errors || false }}
      skip: ${{ matrix.skip != false && true || false }}
      target: ${{ matrix.target }}
      timeout-minutes: 180
      trusted: ${{ inputs.trusted }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: openssl
          name: OpenSSL
          skip: ${{ fromJSON(inputs.request).request.pr != '' || ! fromJSON(inputs.request).run.check-build-openssl }}
        - target: openssl.presubmit
          name: OpenSSL (presubmit)
          skip: ${{ fromJSON(inputs.request).request.pr == '' || ! fromJSON(inputs.request).run.check-build-openssl-presubmit }}
