name: Workflow/complete

permissions:
  contents: read


on:
  # Do not run untrusted code here
  workflow_call:
    secrets:
      app-id:
        required: true
      app-key:
        required: true
    inputs:
      needs:
        type: string
        required: true
      template-check-text:
        type: string
        default: |
          ## \($icon) Check run finished (\($outcome.name) \($outcome.icon))

          ## The check run can be viewed here:

          # \($icon) \($run_link)

env:
  CI_DEBUG: ${{ vars.CI_DEBUG && true || false }}


jobs:
  complete:
    runs-on: ${{ fromJSON(fromJSON(inputs.needs).load.outputs.request).config.ci.agent-ubuntu }}
    permissions:
      actions: read
      contents: read
    steps:
    - uses: envoyproxy/toolshed/actions/jq@1f5b552c6749502b885cb8cf23549b929e745547  # actions-v0.4.17
      name: Incoming data
      id: needs
      with:
        input: |
          check_name: ${{ fromJSON(inputs.needs).load.outputs.check-name }}
          repo: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          outcomes: ${{ toJSON(fromJSON(inputs.needs).*.result) }}
          load: ${{ toJSON(fromJSON(inputs.needs).load.outputs) }}
        input-format: yaml
        print-result: ${{ fromJSON(env.CI_DEBUG || 'false') && true || false }}
        filter: |
          .repo as $repo
          | .run_id as $run_id
          | .needs as $result
          | .check_name as $check_name
          | .load as $load
          | $load["check-id"] as $check_id
          | $load["run-id"] as $workflow_id
          | (.load.request | fromjson) as $request
          | $request.config.envoy.icon as $icon
          | .outcomes
          | if any(. == "failure") then
              {name: "failure", icon: ":x:"}
            elif any(. == "cancelled") then
              {name: "cancelled", icon: ""}
            elif all(. == "skipped") then
              {name: "skipped", icon: ""}
            else
              {name: "success", icon: ":heavy_check_mark:"}
            end
          | . as $outcome
          | "\($request.check.name) (\($request.summary.title))" as $run_link_text
          | "[\($run_link_text)](https://github.com/\($repo)/actions/runs/\($run_id))" as $run_link
          | "${{ inputs.template-check-text }}" as $text
          | {"summary-title": "\($icon) \($request.check.name) complete (\($outcome.name))",
             "check-id": $check_id,
             conclusion: $outcome.name,
             checks: {
               ($check_name): {
                 name: $request.check.name,
                 head_sha: $request.request.sha,
                 status: "completed",
                 conclusion: $outcome.name,
                 external_id: "\($run_id)",
                 output: {
                   title: "\($request.check.name) (\($outcome.name))",
                   summary: "Check has finished",
                   text: $text}}}}

    - uses: envoyproxy/toolshed/actions/jq@1f5b552c6749502b885cb8cf23549b929e745547  # actions-v0.4.17
      name: Print summary
      with:
        input: ${{ toJSON(steps.needs.outputs.value).summary-title }}
        filter: |
          "## \(.)"
        options: -Rr
        output-path: GITHUB_STEP_SUMMARY
    - uses: envoyproxy/toolshed/actions/appauth@1f5b552c6749502b885cb8cf23549b929e745547  # actions-v0.4.17
      name: Appauth
      id: appauth
      with:
        app_id: ${{ secrets.app-id }}
        key: ${{ secrets.app-key }}
    - uses: envoyproxy/toolshed/actions/github/checks@1f5b552c6749502b885cb8cf23549b929e745547  # actions-v0.4.17
      name: Update check
      with:
        action: update
        checks: ${{ toJSON(fromJSON(steps.needs.outputs.value).checks) }}
        token: ${{ steps.appauth.outputs.token }}

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      name: Download PR comment artifacts
      id: download-pr-comments
      continue-on-error: true
      with:
        pattern: pr-comment-*
        path: /tmp/pr-comments
    - if: steps.download-pr-comments.outcome == 'success'
      name: Post PR comments
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
      with:
        github-token: ${{ steps.appauth.outputs.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const dir = '/tmp/pr-comments';
          if (!fs.existsSync(dir)) return;
          for (const subdir of fs.readdirSync(dir)) {
            const filePath = path.join(dir, subdir, 'pr-comment.json');
            if (!fs.existsSync(filePath)) continue;
            const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
            const jobUrl = `https://github.com/${data.repo}/actions/runs/${data.run_id}`;
            const body = data.message + '\n\n[View workflow run](' + jobUrl + ')';
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: data.pr,
                body: body
              });
            } catch (error) {
              console.error(`Failed to comment on PR #${data.pr}:`, error);
            }
          }

    # This is necessary to ensure that any retests have their checks updated
    - name: Fail the job
      if: ${{ fromJSON(steps.needs.outputs.value).conclusion != 'success' }}
      run: |
        exit 1
