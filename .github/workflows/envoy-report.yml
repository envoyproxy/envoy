name: Envoy/CI report

permissions:
  contents: read

on:
  schedule:
  # Sundays, for the week (Sunday to Sunday, midnight UTC) which just ended
  - cron: '1 2 * * 0'
  # The 1st, for the month which just ended
  - cron: '1 3 1 * *'
  # New Year's Day, for the year which just ended, once its last month is in
  - cron: '1 5 1 1 *'
  workflow_dispatch:
    inputs:
      period:
        description: Period to report on.
        type: choice
        default: week
        options:
        - week
        - month
        - year
      date:
        description: Any date (YYYY-MM-DD) in the period. Defaults to the last complete one.
        type: string
      branches:
        description: >-
          Comma-separated branches or patterns to report on. A year has the branches its months do.
        type: string
        default: main,release/v*
      repo:
        description: Repository to report on. Defaults to this one.
        type: string
      upload:
        description: Upload the report data to GCS.
        type: boolean
        default: false
      slack:
        description: Post the report to Slack.
        type: boolean
        default: false
      slack-channel:
        description: Slack channel to post to.
        type: string
        default: '#envoy-ci'

env:
  # Where the report data is kept within the postsubmit artifact bucket
  PREFIX: stats
  PERIOD: >-
    ${{ inputs.period
        || (github.event.schedule == '1 3 1 * *' && 'month')
        || (github.event.schedule == '1 5 1 1 *' && 'year')
        || 'week' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false


jobs:
  months:
    # A year is compiled from the monthly reports which were uploaded, as GitHub does not keep
    # a year of checks. Separate from the report so that only this job sees the key.
    if: >-
      (github.repository == 'envoyproxy/envoy'
       || github.event_name == 'workflow_dispatch')
      && (github.event.schedule
          || !contains(github.actor, '[bot]'))
      && (inputs.period == 'year'
          || github.event.schedule == '1 5 1 1 *')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: envoyproxy/toolshed/actions/gcp/setup@e0d2ffaac17df9f2cb36ff437b87d0d00d265335  # actions-v0.4.36
      with:
        key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_TRUSTED }}
    - name: Download the monthly reports
      env:
        BUCKET: ${{ vars.GCS_ARTIFACT_BUCKET_POST }}
      run: |
        mkdir months
        gcloud storage cp "gs://${BUCKET}/${PREFIX}/month/*.json" months/
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ci-report-months
        path: months
        retention-days: 1

  postsubmit:
    # Pass/fail rate of postsubmit CI per workflow, from the checks on each pushed commit. The
    # summary is for reading, the JSON artifact is for collecting over time.
    needs: months
    if: >-
      !cancelled()
      && needs.months.result != 'failure'
      && (github.repository == 'envoyproxy/envoy'
          || github.event_name == 'workflow_dispatch')
      && (github.event.schedule
          || !contains(github.actor, '[bot]'))
    permissions:
      actions: read
      checks: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      frame: ${{ steps.fetch.outputs.frame || steps.year.outputs.frame }}
      slack: ${{ steps.slack.outputs.value }}
    env:
      REPO: ${{ inputs.repo || github.repository }}
      SLACK_CHANNEL: ${{ inputs.slack-channel || '#envoy-ci' }}
      RUN_URL: >-
        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        sparse-checkout: ci/report

    # A week or a month is fetched from GitHub. Only the fetching is done here: what is fetched
    # is turned into the report, and that rendered, by the toolshed `ci/checks` jq module.
    - name: Fetch commits and checks
      id: fetch
      if: env.PERIOD != 'year'
      run: |
        FRAME="$(python3 ci/report/fetch.py \
            --repo "${REPO}" \
            --out raw.json \
            commits \
            --branches "${BRANCHES}" \
            --period "${PERIOD}" \
            ${DATE:+--date "${DATE}"})"
        echo "frame=${FRAME}" >> "${GITHUB_OUTPUT}"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BRANCHES: ${{ inputs.branches || 'main,release/v*' }}
        DATE: ${{ inputs.date }}
    - name: Find the runs to fetch the jobs of
      if: env.PERIOD != 'year'
      uses: envoyproxy/toolshed/actions/jq@e0d2ffaac17df9f2cb36ff437b87d0d00d265335  # actions-v0.4.36
      with:
        input: raw.json
        input-format: json-path
        output-path: runs.json
        filter: |
          import "ci/checks" as checks;
          checks::runs
    - name: Fetch jobs
      if: env.PERIOD != 'year'
      run: |
        python3 ci/report/fetch.py --repo "${REPO}" --out jobs.json jobs --runs runs.json
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Report
      if: env.PERIOD != 'year'
      uses: envoyproxy/toolshed/actions/jq@e0d2ffaac17df9f2cb36ff437b87d0d00d265335  # actions-v0.4.36
      with:
        input: raw.json
        input-format: json-path
        options: --indent 2 --slurpfile jobs jobs.json
        output-path: ci-report.json
        filter: |
          import "ci/checks" as checks;
          checks::report($jobs[0])

    # A year is compiled from the reports of its months.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      if: env.PERIOD == 'year'
      with:
        name: ci-report-months
        path: months
    - name: Collect the monthly reports
      id: year
      if: env.PERIOD == 'year'
      run: |
        YEAR="${DATE:0:4}"
        YEAR="${YEAR:-$(date -u -d 'last year' +%Y)}"
        jq -s . months/*.json > months.json
        echo "YEAR=${YEAR}" >> "${GITHUB_ENV}"
        echo "frame=year-${YEAR}" >> "${GITHUB_OUTPUT}"
      env:
        DATE: ${{ inputs.date }}
    - name: Report (year)
      if: env.PERIOD == 'year'
      uses: envoyproxy/toolshed/actions/jq@e0d2ffaac17df9f2cb36ff437b87d0d00d265335  # actions-v0.4.36
      with:
        input: months.json
        input-format: json-path
        options: --indent 2
        output-path: ci-report.json
        filter: |
          import "ci/checks" as checks;
          checks::year({
            repo: env.REPO,
            frame: env.YEAR,
            generated: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))})

    - name: Summary
      uses: envoyproxy/toolshed/actions/jq@e0d2ffaac17df9f2cb36ff437b87d0d00d265335  # actions-v0.4.36
      with:
        input: ci-report.json
        input-format: json-path
        options: -r
        output-path: GITHUB_STEP_SUMMARY
        filter: |
          import "ci/checks" as checks;
          checks::summary
    - name: Slack message
      id: slack
      uses: envoyproxy/toolshed/actions/jq@e0d2ffaac17df9f2cb36ff437b87d0d00d265335  # actions-v0.4.36
      with:
        input: ci-report.json
        input-format: json-path
        filter: |
          import "ci/checks" as checks;
          checks::slack(env.SLACK_CHANNEL; env.RUN_URL)
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ci-report-${{ steps.fetch.outputs.frame || steps.year.outputs.frame }}
        path: ci-report.json
        retention-days: 90

  upload:
    # GitHub keeps neither artifacts nor checks for a year, so the data is kept in the
    # postsubmit artifact bucket for compiling longer reports. Separate from the report so that
    # only this job sees the key.
    needs: postsubmit
    # Without a status function this is skipped whenever `months` was.
    if: >-
      !cancelled()
      && needs.postsubmit.result == 'success'
      && (github.event_name == 'schedule'
          || inputs.upload)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: ci-report-${{ needs.postsubmit.outputs.frame }}
    - name: Validate the destination
      id: destination
      env:
        FRAME: ${{ needs.postsubmit.outputs.frame }}
        BUCKET: ${{ vars.GCS_ARTIFACT_BUCKET_POST }}
        BRANCHES: ${{ inputs.branches || 'main,release/v*' }}
        REPO: ${{ inputs.repo || github.repository }}
      run: |
        # What is kept is what the year is compiled from, so only whole reports are, and here
        # only this repository's. Elsewhere, eg a staging repository, has its own bucket.
        if [[ "$BRANCHES" != "main,release/v*" ]]; then
            echo "::error::Only reports of the default branches are uploaded (${BRANCHES})"
            exit 1
        fi
        if [[ "$GITHUB_REPOSITORY" == "envoyproxy/envoy" && "$REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Only reports of this repository are uploaded (${REPO})"
            exit 1
        fi
        # `week-2026-11-15` -> `week/2026-11-15.json`
        if ! [[ "$FRAME" =~ ^(week-[0-9]{4}-[0-9]{2}-[0-9]{2}|month-[0-9]{4}-[0-9]{2}|year-[0-9]{4})$ ]]; then
            echo "::error::Unexpected report name (${FRAME})"
            exit 1
        fi
        if [[ -z "$BUCKET" ]]; then
            echo "::error::No artifact bucket configured"
            exit 1
        fi
        python3 -m json.tool ci-report.json > /dev/null
        echo "url=gs://${BUCKET}/${PREFIX}/${FRAME%%-*}/${FRAME#*-}.json" >> "${GITHUB_OUTPUT}"
    - uses: envoyproxy/toolshed/actions/gcp/setup@e0d2ffaac17df9f2cb36ff437b87d0d00d265335  # actions-v0.4.36
      with:
        key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_TRUSTED }}
    - name: Upload to GCS
      env:
        URL: ${{ steps.destination.outputs.url }}
      run: |
        gcloud storage cp --content-type=application/json ci-report.json "${URL}"
        echo "Uploaded to \`${URL}\`" >> "${GITHUB_STEP_SUMMARY}"

  slack:
    # Separate from the report so that only this job sees the Slack token.
    needs: postsubmit
    if: >-
      !cancelled()
      && needs.postsubmit.result == 'success'
      && (github.event_name == 'schedule'
          || inputs.slack)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
      with:
        method: chat.postMessage
        token: ${{ secrets.SLACK_BOT_TOKEN }}
        payload: ${{ needs.postsubmit.outputs.slack }}
