name: Request/incoming

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      app-id:
        required: true
      app-key:
        required: true
      lock-app-id:
        required: true
      lock-app-key:
        required: true

    # Defaults are set .github/config.yml on the `main` branch.
    inputs:
      config-file:
        type: string
        default: ./.github/config.yml

concurrency:
  group: |
    ${{ github.actor != 'trigger-release-envoy[bot]'
        && github.head_ref
        || github.run_id
    }}-${{ github.workflow }}-env-prime
  cancel-in-progress: true

env:
  CI_DEBUG: ${{ (vars.CI_DEBUG || vars.RUNNER_DEBUG) && true || false }}


jobs:
  incoming:
    if: ${{ github.repository == 'envoyproxy/envoy' || vars.ENVOY_CI }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      env: ${{ steps.data.outputs.value }}
      config: ${{ steps.config.outputs.config }}
    steps:
    - uses: envoyproxy/toolshed/actions/jq@0b8831c802e19cf74905c23a37b7b3caa5e6ad90  # actions-v0.4.30
      id: started
      name: Create timestamp
      with:
        options: -r
        filter: |
          now
    - uses: envoyproxy/toolshed/actions/github/checkout@0b8831c802e19cf74905c23a37b7b3caa5e6ad90  # actions-v0.4.30
      id: checkout
      name: Checkout Envoy repository (requested)
      with:
        pr: ${{ github.event.number }}
        branch: ${{ github.base_ref || github.ref_name }}
        config: |
          fetch-depth: ${{ startsWith(github.event_name, 'pull_request') && 1 || 2 }}
          path: requested
          # actions/checkout >= 7 refuses to fetch a fork PR's merge commit from a
          # `pull_request_target` workflow unless told to. This job fetches it on purpose, and
          # only to read it: see below, nothing from the checkout is executed.
          allow-unsafe-pr-checkout: true
    # This step *LOOKS AT* the repo at the point requested
    # Its essential that this _job_ *MUST NOT EXECUTE ANY CODE FROM THE CHECKED OUT REPO*
    # *ALL* variables collected should be treated as untrusted and should be sanitized before
    # use
    - name: Generate environment variables from commit
      uses: envoyproxy/toolshed/actions/envoy/ci/request@0b8831c802e19cf74905c23a37b7b3caa5e6ad90  # actions-v0.4.30
      id: env
      with:
        branch-name: ${{ steps.checkout.outputs.branch-name }}
        config-file: ${{ inputs.config-file }}
        merge-commit: ${{ steps.checkout.outputs.merge-commit }}
        started: ${{ steps.started.outputs.value }}
        token: ${{ secrets.GITHUB_TOKEN }}
        vars: ${{ toJSON(vars) }}
        working-directory: requested

    - name: Request summary
      id: summary
      uses: envoyproxy/toolshed/actions/github/env/summary@0b8831c802e19cf74905c23a37b7b3caa5e6ad90  # actions-v0.4.30
      with:
        actor: ${{ toJSON(fromJSON(steps.env.outputs.data).request.actor) }}
        base-sha: ${{ fromJSON(steps.env.outputs.data).request.base-sha }}
        link: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        output-path: GITHUB_STEP_SUMMARY
        pr: ${{ github.event.number }}
        data: ${{ steps.env.outputs.data }}
        tables: ${{ toJSON(fromJSON(steps.env.outputs.data).config.tables) }}
        icon: ${{ fromJSON(steps.env.outputs.data).config.envoy.icon }}
        message: ${{ fromJSON(steps.env.outputs.data).request.message }}
        ref: ${{ fromJSON(steps.env.outputs.data).request.ref }}
        sha: ${{ fromJSON(steps.env.outputs.data).request.sha }}
        target-branch: ${{ fromJSON(steps.env.outputs.data).request.target-branch }}

    - name: Environment data
      uses: envoyproxy/toolshed/actions/jq@0b8831c802e19cf74905c23a37b7b3caa5e6ad90  # actions-v0.4.30
      id: data
      with:
        input: |
          env: ${{ steps.env.outputs.data }}
          title: ${{ steps.summary.outputs.title }}
          link: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          summary: ${{ steps.summary.outputs.summary }}
        input-format: yaml
        filter: |
          # `$legacy` is the jobs of a branch that predates the check's targets. Options in
          # `$ignore` are flags such a branch can already have, so do not show it has the targets.
          def check_build_jobs($run; $check; $name; $legacy; $ignore):
            [$run
             | to_entries[]
             | select(.key | test("^check-build-\($check)-[a-z0-9-]+$"))
             | .option = (.key | ltrimstr("check-build-\($check)-"))] as $flags
            | if ($flags | map(select(.option as $option | any($ignore[]; . == $option) | not)) | length) == 0 then
                $legacy
              else
                [$flags[]
                 | select(.value)
                 | {target: "\($check).\(.option | gsub("-"; "_"))",
                    name: "\($name) (\(.option | gsub("-"; " ")))"}]
                | sort_by(.target)
              end;
          def check_build_jobs($run; $check; $single):
            check_build_jobs($run; $check; $single.name; [$single]; []);
          .title as $title
          | .env.config.envoy.icon as $icon
          | .link as $link
          | "\($icon) Request ([\($title)](\($link)))" as $linkedTitle
          | .summary as $summary
          | .env
          # The Check/build jobs a branch sets with run flags in its config: one per
          # `check-build-<check>-<option>` flag that is set, as the `<check>.<option>` target. A
          # branch with no flags for a check predates its targets and has the single job it had.
          | .config.ci["check-build"] = (
              check_build_jobs(
                .run; "cto";
                {target: "compile_time_options", name: "Compile time options", "docker-ci": true})
              + check_build_jobs(.run; "gcc"; {target: "gcc", name: "GCC"}))
          # Check/build (OpenSSL) is set the same way with `check-build-openssl-*` flags. Some of its
          # targets are only for pull requests, and some only for anything else (pushes, schedules).
          #
          # Branches that predate the `openssl.*` targets have the `check-build-openssl`,
          # `check-build-openssl-presubmit` and `check-build-openssl-asan` flags. Their jobs, and
          # the options ignored for them, can be removed once release/v1.40 and any branch cut
          # before the `openssl.*` targets landed are no longer supported; a branch with no flags
          # then needs an empty list.
          | ((.request.pr // "" | tostring) != "") as $pr
          | .run as $run
          | .config.ci["check-build-openssl"] = (
              check_build_jobs(
                .run; "openssl"; "OpenSSL";
                [{target: "openssl", name: "OpenSSL", flag: "check-build-openssl"},
                 {target: "openssl.presubmit", name: "OpenSSL (presubmit)",
                  flag: "check-build-openssl-presubmit"},
                 {target: "openssl.asan", name: "OpenSSL ASAN", flag: "check-build-openssl-asan"}]
                | map(select($run[.flag]) | del(.flag));
                ["asan", "presubmit"])
              | map(select(
                  .target as $target
                  | if $pr then
                      ["openssl", "openssl.asan", "openssl.test"]
                    else
                      ["openssl.presubmit", "openssl.test_affected"]
                    end
                  | any(.[]; . == $target)
                  | not)))
          | .summary = {
              $summary,
              $title,
              $link,
              "linked-title": $linkedTitle}
          | del(.config.tables)

  checks:
    if: ${{ github.repository == 'envoyproxy/envoy' || vars.ENVOY_CI }}
    needs: incoming
    uses: ./.github/workflows/_request_checks.yml
    secrets:
      app-id: ${{ secrets.app-id }}
      app-key: ${{ secrets.app-key }}
    with:
      env: ${{ needs.incoming.outputs.env }}
