date: October 22, 2026

bug_fixes:
- area: release
  change: |
    Updated docker image to resolve the ``eMudhra`` Intermediate CA Compromise vulnerability.

minor_behavior_changes:
- area: dns_resolver
  change: |
    Updated the ``webpki-roots`` and ``rustls-webpki`` crates used by the built-in Hickory DNS resolver
    dynamic module, so that DNS-over-TLS and DNS-over-HTTPS upstreams no longer trust the compromised
    eMudhra intermediate CA certificates (see https://emudhra.we-have-a-problem.com/).
- area: tls
  change: |
    Removed the ``AAA Certificate Services`` and ``emSign ECC Root CA - G3`` roots from the root
    certificate bundle built into Envoy Mobile. Both roots issued or cross-signed eMudhra intermediate
    CA certificates whose private keys were compromised (see
    https://emudhra.we-have-a-problem.com/). Servers whose certificate chains only lead to these roots
    are no longer trusted by Envoy Mobile when it uses its built-in bundle.
